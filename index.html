<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnership Review Dashboard 2026 — Fox Footy Monthly Audience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181D; --ink-soft:#5A616E; --ink-faint:#8A909C;
    --bg:#ECEEF1; --card:#FFFFFF; --line:#E1E4E9; --line-soft:#EDEFF2;
    --brand:#E4002B; --accent:#1F3A5F; --accent-soft:#EAEEF4;
    --good:#10876B; --good-bg:#E4F3EE;
    --warn:#C98A00; --warn-bg:#FAF1DC;
    --bad:#E4632B;  --bad-bg:#FCEDE4;
    --track:#EDEFF2;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(20,24,31,.04);
    --shadow-lg:0 12px 40px -16px rgba(20,24,31,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;font-size:14px}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

  header.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;height:58px}
  .wordmark{font-family:'Space Grotesk';font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .wordmark .spade{width:16px;height:16px;background:var(--brand);border-radius:3px 3px 3px 8px;transform:rotate(45deg)}
  .wordmark small{font-weight:500;color:#9aa2b1;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-left:2px}
  .top .spacer{flex:1}
  .top-btn{color:#c7cdd8;font-size:13px;font-weight:500;padding:7px 11px;border-radius:8px}
  .top-btn:hover{background:#252a33;color:#fff}
  .crumb{color:#9aa2b1;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
  .crumb b{color:#fff;font-weight:600}
  .crumb button{color:#9aa2b1}
  .crumb button:hover{color:#fff;text-decoration:underline}

  main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}

  .port{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
  .att-banner{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;background:var(--card)}
  .att-banner.att-clear{border-color:var(--good-bg)}
  .att-head{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin-bottom:10px}
  .att-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line-soft);cursor:pointer}
  .att-row:hover .att-name{color:var(--accent)}
  .att-name{font-size:13.5px;font-weight:600}
  .att-bits{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .att-pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
  .att-pending{background:var(--warn-bg);color:var(--warn)}
  .att-overdue{background:var(--bad-bg);color:var(--bad)}
  .att-off{background:var(--bad-bg);color:var(--bad)}
  .att-clear-line{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);padding:2px 2px 14px}
  .att-clear-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
  .port .cell{background:var(--card);padding:16px 18px}
  .port .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600}
  .port .v{font-family:'Space Grotesk';font-weight:700;font-size:24px;margin-top:5px;letter-spacing:-.02em}
  .port .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .port .v.pos{color:var(--good)} .port .v.neg{color:var(--bad)}

  .section-row{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
  .section-row h2{font-family:'Space Grotesk';font-weight:600;font-size:15px;margin:0;letter-spacing:-.01em}
  .filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chip{font-size:12.5px;font-weight:500;color:var(--ink-soft);padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

  .board{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .13s ease,box-shadow .13s ease,border-color .13s;position:relative;overflow:hidden}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#d4d8df}
  .pcard .statusline{position:absolute;left:0;top:0;bottom:0;width:4px}
  .pcard.good .statusline{background:var(--good)} .pcard.warn .statusline{background:var(--warn)} .pcard.bad .statusline{background:var(--bad)} .pcard.none .statusline{background:var(--line)}
  .pcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:3px}
  .pcard .name{font-family:'Space Grotesk';font-weight:600;font-size:16.5px;letter-spacing:-.01em;margin:0}
  .pcard .cp{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .statusdot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .statusdot i{width:7px;height:7px;border-radius:50%}
  .sd-good{background:var(--good-bg);color:var(--good)} .sd-good i{background:var(--good)}
  .sd-warn{background:var(--warn-bg);color:var(--warn)} .sd-warn i{background:var(--warn)}
  .sd-bad{background:var(--bad-bg);color:var(--bad)} .sd-bad i{background:var(--bad)}
  .sd-none{background:var(--line-soft);color:var(--ink-faint)} .sd-none i{background:var(--ink-faint)}
  .snapmeta{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin:2px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cat{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px}
  .verdict{font-size:13.5px;color:var(--ink);line-height:1.5;margin:0 0 14px;min-height:20px}
  .verdict.empty{color:var(--ink-faint);font-style:italic}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:12px}
  .metric .ml{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .metric .mlab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
  .metric .mval{font-family:'JetBrains Mono';font-weight:500;font-size:12px}
  .metric .mval .pct{font-weight:700;margin-left:5px}
  .metric .mval .pct.pos{color:var(--good)} .metric .mval .pct.neg{color:var(--bad)}
  .bar{position:relative;height:7px;background:var(--track);border-radius:4px;overflow:visible}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .bar .fill.pos{background:var(--good)} .bar .fill.neg{background:var(--bad)} .bar .fill.mid{background:var(--warn)}
  .bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
  .bar .tick::after{content:'';position:absolute;top:-4px;left:-2px;width:6px;height:4px;background:var(--ink);border-radius:0 0 3px 3px}
  .cardfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:11px;margin-top:2px}
  .valadd{font-size:12px;color:var(--ink-soft)}
  .valadd b{font-family:'JetBrains Mono';color:var(--good);font-weight:700}
  .callbadge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
  .call-renew{color:var(--good);border-color:var(--good)} .call-evolve{color:var(--accent);border-color:var(--accent)}
  .call-renegotiate{color:var(--warn);border-color:var(--warn)} .call-exit{color:var(--bad);border-color:var(--bad)}
  .addcard{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:var(--radius);background:transparent;color:var(--ink-soft);font-weight:500;min-height:120px;font-size:14px;gap:8px}
  .addcard:hover{border-color:var(--accent);color:var(--accent);background:var(--card)}
  .empty-state{text-align:center;padding:70px 20px;color:var(--ink-soft)}
  .empty-state h3{font-family:'Space Grotesk';color:var(--ink);font-size:18px;margin:0 0 6px}

  .detail-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
  .dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .dh-name{font-family:'Space Grotesk';font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0}
  .dh-cp{color:var(--ink-soft);font-size:13.5px;margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dh-term{font-size:12.5px;color:var(--ink-faint)}
  .dh-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .snap-select{display:flex;align-items:center;gap:8px}
  .snap-select label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
  select.sel,input.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
  select.sel{padding-right:26px}
  input.inp:focus,textarea.inp:focus,select.sel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .snap-select select{width:auto;min-width:190px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}.board{grid-template-columns:1fr}.port{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
  .panel-head h3{font-family:'Space Grotesk';font-weight:600;font-size:14px;margin:0;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .panel-head .lil{font-size:11px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .panel-body{padding:18px}
  .linkbtn{color:var(--accent);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px}
  .linkbtn:hover{background:var(--accent-soft)}

  .comm-metric{margin-bottom:20px}
  .comm-metric:last-child{margin-bottom:0}
  .comm-metric .cm-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .comm-metric .cm-name{font-weight:600;font-size:13.5px}
  .comm-metric .cm-fig{font-family:'JetBrains Mono';font-size:13px}
  .comm-metric .cm-fig .a{font-weight:700;font-size:15px}
  .comm-metric .cm-fig .e{color:var(--ink-faint)}
  .comm-metric .cm-delta{font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;margin-left:8px}
  .comm-metric .cm-delta.pos{color:var(--good)} .comm-metric .cm-delta.neg{color:var(--bad)}
  .bar.big{height:11px}

  /* components (shows / packages) */
  .comp{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 15px;margin-bottom:12px;background:#fcfcfd}
  .comp:last-child{margin-bottom:0}
  .comp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
  .comp-name{font-weight:600;font-size:14px}
  .comp-mode{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);background:var(--line-soft);padding:2px 6px;border-radius:4px;font-weight:600;margin-left:7px}
  .comp-inv{font-family:'JetBrains Mono';font-weight:700;font-size:14px}
  .comp-inv small{display:block;font-family:'Inter';font-weight:500;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;text-align:right}
  .comp-investments{display:flex;align-items:flex-start;gap:16px}.comp-investments .comp-inv{min-width:70px;text-align:right}
  .aud-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:5px}
  .aud-row .mlab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
  .aud-row .mono{font-weight:500}
  .cpm-line{display:flex;gap:16px;margin-top:9px;font-size:12px;color:var(--ink-soft)}
  .cpm-line b{font-family:'JetBrains Mono'}
  .comp-ent{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  .comp-ent summary{font-size:11.5px;color:var(--accent);font-weight:600;cursor:pointer;list-style:none}
  .comp-ent summary::-webkit-details-marker{display:none}
  .ent-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .ent-chip{font-size:11px;background:var(--line-soft);color:var(--ink-soft);padding:3px 8px;border-radius:5px}
  .comp-editbtn{opacity:0;color:var(--accent);font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px}
  .comp:hover .comp-editbtn{opacity:1}
  .comp-editbtn:hover{background:var(--line-soft);color:var(--ink)}
  .media-total{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--line);margin-top:4px;padding-top:12px;font-size:13px}
  .media-total .mt-l{font-weight:700}
  .media-total .mt-r{font-family:'JetBrains Mono';font-weight:700;text-align:right}
  .media-total .mt-r small{display:block;font-family:'Inter';font-weight:500;font-size:11px;color:var(--ink-soft)}

  .quads{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
  .quad{background:var(--card);padding:14px 15px;min-height:96px}
  .quad h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:0 0 9px;display:flex;align-items:center;gap:7px}
  .quad h4 .qi{width:6px;height:6px;border-radius:50%}
  .quad.win h4{color:var(--good)} .quad.win h4 .qi{background:var(--good)}
  .quad.fall h4{color:var(--bad)} .quad.fall h4 .qi{background:var(--bad)}
  .quad.deliv h4{color:var(--ink-soft)} .quad.deliv h4 .qi{background:var(--ink-soft)}
  .quad.evo h4{color:var(--accent)} .quad.evo h4 .qi{background:var(--accent)}
  .quad ul{margin:0;padding-left:16px} .quad li{font-size:12.5px;margin-bottom:6px;line-height:1.42}
  .quad .none{font-size:12.5px;color:var(--ink-faint);font-style:italic}

  /* strategic levers */
  .levers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:860px){.levers{grid-template-columns:1fr 1fr}}
  .lever{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;background:#fcfcfd}
  .lever .lv-h{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .lever .lv-name{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--ink)}
  .lever .lv-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .lv-dot.good{background:var(--good)} .lv-dot.watch{background:var(--warn)} .lv-dot.concern{background:var(--bad)} .lv-dot.none{background:var(--line)}
  .lever .lv-note{font-size:12px;color:var(--ink-soft);line-height:1.45}
  .lever .lv-note.empty{color:var(--ink-faint);font-style:italic}

  .flag{}
  .verdict-panel{border-top:3px solid var(--accent)}
  .vp-status{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .vp-opt{flex:1;min-width:90px;text-align:center;padding:9px;border-radius:9px;border:1.5px solid var(--line);font-weight:600;font-size:12.5px;color:var(--ink-soft)}
  .vp-opt.sel-good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
  .vp-opt.sel-warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
  .vp-opt.sel-bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
  .field .hint{font-size:11.5px;color:var(--ink-faint);font-weight:400;text-transform:none;letter-spacing:0;margin-top:5px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px;transition:.12s}
  .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:#152943}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)} .btn-ghost:hover{border-color:var(--ink-soft)}
  .btn-danger{color:var(--bad)} .btn-danger:hover{background:var(--bad-bg)}

  .scrim{position:fixed;inset:0;background:rgba(20,24,31,.42);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .16s ease}
  .modal.wide{max-width:700px}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-family:'Space Grotesk';font-weight:600;font-size:16px;margin:0}
  .modal-body{padding:20px 22px;max-height:68vh;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .x{font-size:20px;color:var(--ink-faint);padding:4px 8px;border-radius:6px;line-height:1} .x:hover{background:var(--line-soft);color:var(--ink)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:80;box-shadow:var(--shadow-lg);animation:pop .16s}
  .example-tag{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:5px;text-transform:uppercase}

  /* view-as toggle */
  .viewas{display:flex;align-items:center;gap:10px}
  .viewas .email{color:#9aa2b1;font-size:12px}
  .vtoggle{display:flex;background:#252a33;border-radius:8px;padding:3px}
  .vtoggle button{font-size:12px;font-weight:600;color:#9aa2b1;padding:5px 11px;border-radius:6px}
  .vtoggle button.on{background:var(--accent);color:#fff}

  /* partner portal */
  .pbanner{background:linear-gradient(180deg,var(--ink),#1e222b);color:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:18px}
  .pbanner .pb-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9aa2b1;font-weight:600}
  .pbanner h1{font-family:'Space Grotesk';font-weight:700;font-size:24px;margin:5px 0 8px;letter-spacing:-.01em}
  .pbanner p{margin:0;color:#c7cdd8;font-size:13.5px;max-width:640px;line-height:1.5}
  .pbanner .pb-note{margin-top:12px;font-size:12px;color:#9aa2b1;display:flex;align-items:center;gap:7px}
  .pbanner .pb-note i{width:7px;height:7px;border-radius:50%;background:var(--warn)}

  .pshow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .pshow-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
  .pshow-head .ps-name{font-family:'Space Grotesk';font-weight:600;font-size:16px}

  .wk-empty{font-size:13px;color:var(--ink-faint);font-style:italic;margin-bottom:12px}

  .wkform{background:#fafbfc;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px}

  /* internal weekly log inside component */

  .clip-toggle summary{cursor:pointer;color:var(--accent);font-size:11px;font-weight:600;list-style:none}

  .verifybtn{font-size:11px;font-weight:600;color:var(--good);padding:3px 8px;border-radius:5px;border:1px solid var(--good)}

  .assetfulfil-strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .afx{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600}

  /* Decision modules */
  .module-nav{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 12px;margin:-4px 0 6px;scrollbar-width:thin}
  .module-nav button{white-space:nowrap;padding:8px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .module-nav button:hover{background:var(--line-soft);color:var(--ink)} .module-nav button.on{background:var(--ink);color:#fff}
  .module-hero{background:linear-gradient(135deg,#16181D,#2a313d);color:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
  .module-hero .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#aeb7c6}.module-hero h2{font-family:'Space Grotesk';font-size:23px;letter-spacing:-.02em;margin:5px 0 6px}.module-hero p{margin:0;color:#cbd2dc;max-width:720px;font-size:13px}
  .metric-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.metric-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow)}
  .metric-card .label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}.metric-card .value{font-family:'Space Grotesk';font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:4px}.metric-card .compare{font-size:11.5px;color:var(--ink-soft);margin-top:4px}.delta.good{color:var(--good);font-weight:700}.delta.bad{color:var(--bad);font-weight:700}.delta.warn{color:var(--warn);font-weight:700}
  .dtable{width:100%;border-collapse:collapse;font-size:12.5px}.dtable th{text-align:left;color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.dtable td{padding:10px 9px;border-bottom:1px solid var(--line-soft)}.dtable tr:last-child td{border-bottom:0}.dtable .num{text-align:right;font-family:'JetBrains Mono';font-size:12px}.dtable .muted{color:var(--ink-faint)}
  .perf-export{display:inline-flex;gap:6px;margin-left:10px;padding-left:12px;border-left:1px solid var(--line)}
  .perf-x{font-size:11px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:7px;transition:.12s;cursor:pointer}
  .perf-x:hover{border-color:var(--brand);color:var(--brand)}
  .perf-table{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}
  .perf-table>summary{font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
  .perf-table>summary::-webkit-details-marker{display:none}
  .perf-table>summary::before{content:'▸';color:var(--ink-faint);font-size:10px}
  .perf-table[open]>summary::before{content:'▾'}
  .stackbar{height:12px;border-radius:6px;overflow:hidden;background:var(--track);display:flex;margin:12px 0}.stackbar span{height:100%}.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft)}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .funnel{display:flex;align-items:stretch;gap:5px;overflow-x:auto;padding:4px 0}.funnel-step{min-width:112px;flex:1;background:var(--accent-soft);border-radius:8px;padding:11px}.funnel-step:nth-child(2){background:#e9f0fb}.funnel-step:nth-child(3){background:#edf5f2}.funnel-step:nth-child(4){background:#f8f0e4}.funnel-step .fnum{font-family:'Space Grotesk';font-size:19px;font-weight:700}.funnel-step .flab{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
  .summary-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.summary-list{margin:0;padding:0;list-style:none}.summary-list li{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px}.summary-list li:last-child{border-bottom:0}.summary-list .evidence{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:3px}.decision-card{border-radius:var(--radius);padding:18px;border:1px solid var(--accent);background:var(--accent-soft)}.decision-card .decision{font-family:'Space Grotesk';font-size:24px;font-weight:700;color:var(--accent);margin:3px 0 7px}.timeline{border-left:2px solid var(--line);margin:4px 0 0 6px;padding-left:15px}.timeline div{position:relative;padding:0 0 14px;font-size:12.5px}.timeline div:before{content:'';position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}.timeline small{color:var(--ink-faint);display:block;margin-top:2px}
  .insight{border-left:3px solid var(--accent);padding:13px 15px;background:#F7F8FA;border-radius:0 9px 9px 0;margin-bottom:14px;font-size:13.5px;line-height:1.55}.ai-note{font-size:11.5px;color:var(--ink-faint);margin-top:10px}.data-note{font-size:11.5px;color:var(--ink-faint);margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
  .overview-layout{display:grid;grid-template-columns:minmax(310px,.78fr) minmax(0,1.22fr);gap:18px;align-items:start}.overview-rail{display:flex;flex-direction:column;gap:18px}.overview-rail .panel{margin-bottom:0}.pulse-status{display:flex;align-items:center;gap:8px;margin-bottom:14px}.pulse-status b{font-family:'Space Grotesk';font-size:17px}.pulse-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}.pulse-grid div{background:var(--card);padding:11px}.pulse-grid span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700}.pulse-grid b{display:block;margin-top:3px;font-size:12.5px;color:var(--ink)}.pulse-note{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:14px 0 0}.pulse-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .pulse-evidence{margin:11px 0 0;padding:10px 0 0 16px;border-top:1px solid var(--line-soft);color:var(--ink-soft);font-size:11.5px;line-height:1.45}.pulse-evidence li{margin:4px 0}.pulse-fresh{font-size:10.5px;color:var(--ink-faint);margin-top:10px}
  @media(max-width:860px){.metric-strip{grid-template-columns:1fr 1fr}.summary-grid,.overview-layout{grid-template-columns:1fr}}@media(max-width:520px){.metric-strip{grid-template-columns:1fr}.module-hero{padding:18px}.dtable{font-size:11.5px}.dtable th,.dtable td{padding:8px 6px}}
  @media print{header.top,.module-nav,.linkbtn,.btn,.filters,.perf-toolbar,#modalMount,#drawerMount,#toastMount{display:none!important}body{background:#fff}main{max-width:none;padding:0}.panel,.metric-card{box-shadow:none}.module-hero{background:#fff;color:var(--ink);border:1px solid var(--line)}.module-hero p,.module-hero .eyebrow{color:var(--ink-soft)}}
  @media(max-width:720px){

  /* ============================================================
     EXECUTIVE DASHBOARD SYSTEM
     A restrained BI shell layered over the existing application.
     ============================================================ */
  :root{
    --ink:#111318;
    --ink-soft:#667085;
    --ink-faint:#8B95A5;
    --bg:#F5F6F8;
    --card:#FFFFFF;
    --line:#E3E7EC;
    --line-soft:#EEF0F3;
    --brand:#E31B23;
    --accent:#E31B23;
    --accent-soft:#FDEBEC;
    --good:#356B4C;
    --good-bg:#EAF3ED;
    --warn:#93610A;
    --warn-bg:#FFF3DA;
    --bad:#B4232C;
    --bad-bg:#FDE9EA;
    --track:#EEF0F3;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,24,40,.035),0 8px 22px rgba(16,24,40,.035);
    --shadow-lg:0 18px 48px -18px rgba(16,24,40,.28);
    --nav:#111827;
    --nav-soft:#202B3D;
  }
  body{background:var(--bg);font-size:13px}
  .app-shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .shell-nav{position:sticky;top:0;height:100vh;background:var(--nav);color:#fff;padding:28px 18px 22px;display:flex;flex-direction:column;z-index:50;overflow:visible}
  .shell-brand{display:flex;align-items:center;gap:11px;padding:0 11px 31px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;letter-spacing:-.02em}
  .shell-mark{width:29px;height:29px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-family:'Space Grotesk';font-weight:700}
  .shell-kicker{margin:0 11px 9px;color:#77859B;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
  .shell-nav-list{display:grid;gap:4px}
  .shell-nav-btn{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:8px;color:#AEB8C8;text-align:left;font-size:12.5px;font-weight:600;transition:background .16s,color .16s,transform .16s}
  .shell-nav-btn:hover{background:#1B2536;color:#fff;transform:translateX(1px)}
  .shell-nav-btn.on{background:var(--nav-soft);color:#fff}
  .shell-nav-btn.on:before{content:'';position:absolute;left:-18px;top:10px;width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--brand)}
  .shell-nav-btn svg{width:17px;height:17px;flex:none}
  .shell-nav-btn.is-disabled{opacity:.42}
  .shell-nav-btn.is-disabled:hover{background:transparent;color:#AEB8C8;transform:none}
  .shell-selector-wrap{position:relative;margin:11px 0 8px;padding:12px 9px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
  .shell-selector-label{margin:0 2px 7px;color:#77859B;font-size:8.5px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
  .shell-partnership-button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.11);border-radius:7px;background:#182235;color:#fff;text-align:left;font-size:11.5px;font-weight:700}
  .shell-partnership-button:hover,.shell-partnership-button[aria-expanded="true"]{border-color:rgba(255,255,255,.24);background:#202B3D}
  .shell-partnership-button .selector-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shell-partnership-button svg{width:13px;height:13px;flex:none;transition:transform .16s}
  .shell-partnership-button[aria-expanded="true"] svg{transform:rotate(180deg)}
  .shell-selector-menu{position:fixed;z-index:200;left:0;top:0;width:230px;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 18px 48px rgba(16,24,40,.18);color:var(--ink)}
  .shell-selector-menu[hidden]{display:none}
  .shell-selector-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border-radius:7px;text-align:left;font-size:11.5px;font-weight:650}
  .shell-selector-option:hover{background:#F4F5F7}
  .shell-selector-option.selected{background:var(--accent-soft);color:var(--brand)}
  .shell-selector-option small{color:var(--ink-faint);font-size:9px;font-weight:500}
  .shell-selector-empty{padding:12px;color:var(--ink-faint);font-size:11px}
  .shell-nav-spacer{flex:1}
  .shell-partner{margin:24px 10px 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
  .shell-partner-logo{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.13);background:#202B3D;display:grid;place-items:center;font-weight:700;font-size:11px}
  .shell-partner strong{display:block;font-size:11.5px}.shell-partner small{display:block;color:#77859B;font-size:9.5px;margin-top:2px}
  .shell-main{position:relative;z-index:1;min-width:0}

  header.top{position:sticky;top:0;height:68px;padding:0 38px;background:rgba(245,246,248,.92);color:var(--ink);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);z-index:40}
  header.top .wordmark{display:none}
  .top .spacer{display:none}
  #crumb{margin-right:auto}
  .crumb{color:var(--ink-faint);font-size:11.5px}.crumb b{color:var(--ink);font-weight:700}.crumb button{color:var(--ink-soft)}
  .crumb button:hover{color:var(--brand);text-decoration:none}
  .top-btn{color:var(--ink-soft);font-size:11.5px;font-weight:650;padding:7px 10px;border:1px solid transparent}
  .top-btn:hover{background:#fff;color:var(--ink);border-color:var(--line)}
  .viewas .email{color:var(--ink-soft)}
  .vtoggle{background:#E9EBEF;border-radius:7px}
  .vtoggle button{color:var(--ink-soft);font-size:11px;padding:5px 10px}
  .vtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}

  main{max-width:1390px;margin:0 auto;padding:34px 38px 90px}
  .port{border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
  .port .cell{padding:22px 22px 20px}
  .port .k,.metric-card .label{font-size:9.5px;font-weight:750;letter-spacing:.08em}
  .port .v{font-family:'JetBrains Mono',monospace;font-size:29px;font-weight:700;letter-spacing:-.05em;margin-top:10px}
  .port .sub{font-size:10.5px;margin-top:7px}
  .att-banner{border-radius:10px;box-shadow:none;padding:13px 16px}
  .att-head{font-family:'Inter';font-size:12.5px}
  .section-row{margin:31px 1px 14px}
  .section-row h2{font-size:19px;font-weight:700;letter-spacing:-.035em}
  .chip{font-size:11px;border-radius:7px;padding:6px 10px}
  .chip.on{background:var(--ink);border-color:var(--ink)}
  .board{gap:18px}
  .pcard{padding:22px 22px 18px;border-radius:var(--radius);box-shadow:var(--shadow)}
  .pcard:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(16,24,40,.07)}
  .pcard .statusline{width:3px}
  .pcard .name{font-size:18px}.pcard .cp{font-size:11px}
  .statusdot,.wk-status,.att-pill{border-radius:999px;font-size:9px;letter-spacing:.055em}
  .cat{background:transparent;color:var(--brand);padding:0;font-size:9px;letter-spacing:.09em}
  .metrics{margin-top:17px;gap:16px 24px}
  .metric .mlab{font-size:9.5px}.metric .mval{font-size:11.5px}
  .bar{height:5px}
  .callbadge{border-radius:999px;font-size:9px;padding:4px 9px}

  .detail-head{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;box-shadow:none;padding:5px 0 25px;margin-bottom:17px}
  .dh-name{font-size:34px;letter-spacing:-.045em}
  .dh-cp{font-size:11.5px;margin-top:7px}.dh-term{font-size:10.5px}
  .dh-identity{min-width:240px}
  .dh-headline-strip{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));margin-top:24px;border-top:1px solid var(--line)}
  .dh-headline-stat{padding:17px 20px 0 0}

  .dh-headline-stat b{display:block;font-family:'JetBrains Mono';font-size:19px;line-height:1.15;letter-spacing:-.035em;color:var(--ink)}

  }
  select.sel,input.inp,textarea.inp{border-radius:7px;font-size:12px}
  input.inp:focus,textarea.inp:focus,select.sel:focus{outline:3px solid rgba(227,27,35,.13);border-color:var(--brand)}
  .module-nav{gap:22px;padding:0;margin:0 0 20px;border-bottom:1px solid var(--line)}
  .module-nav button{padding:10px 1px 12px;border-radius:0;font-size:11.5px}
  .module-nav button:hover{background:transparent;color:var(--ink)}
  .module-nav button.on{position:relative;background:transparent;color:var(--ink)}
  .module-nav button.on:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand)}

  .panel,.metric-card{border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel-head{padding:17px 20px}
  .panel-head h3{font-family:'Inter';font-size:13px;font-weight:700;letter-spacing:-.01em}
  .panel-head .lil{font-size:9px}
  .panel-body{padding:20px}
  .linkbtn{color:var(--ink);font-size:10.5px}
  .linkbtn:hover{background:transparent;color:var(--brand)}
  .btn{border-radius:7px;font-size:11.5px;padding:9px 14px}
  .btn-primary{background:var(--brand)}
  .btn-primary:hover{background:#BA131A}
  .btn-ghost{background:#fff}
  .overview-layout{grid-template-columns:minmax(300px,.7fr) minmax(0,1.3fr);gap:18px}
  .pulse-status b{font-family:'Inter';font-size:15px}
  .pulse-grid{border-radius:8px}
  .pulse-grid span{font-size:8.5px}.pulse-grid b{font-family:'JetBrains Mono';font-size:11.5px}
  .comp{border-radius:8px;background:#FCFCFD;padding:16px;margin-bottom:10px}
  .comp-name{font-size:13px}.comp-inv{font-size:13px}
  .quads{border-radius:8px}
  .quad,.lever{background:#FCFCFD}
  .verdict-panel{border-top:2px solid var(--brand)}
  .vp-opt{border-radius:7px;font-size:11px}

  .module-hero{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:24px 25px;box-shadow:var(--shadow);overflow:hidden}
  .module-hero:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
  .module-hero .eyebrow{color:var(--brand)}
  .module-hero h2{font-size:25px}.module-hero p{color:var(--ink-soft)}
  .metric-strip{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .metric-card{border:0;border-radius:0;box-shadow:none;padding:19px 20px}
  .metric-card .value{font-family:'JetBrains Mono';font-size:26px;letter-spacing:-.05em;margin-top:9px}
  .dtable th{font-size:9px;background:#FAFAFB;padding:10px 12px}.dtable td{padding:12px}
  .decision-card{border-color:var(--line);border-left:3px solid var(--brand);background:#FCFCFD}
  .decision-card .decision{color:var(--ink)}
  .insight{border-left-color:var(--brand);background:#FAFAFB}

  .pbanner{position:relative;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0 26px;box-shadow:none}
  .pbanner .pb-eyebrow{color:var(--brand);font-size:9px;font-weight:750}
  .pbanner h1{font-size:34px;letter-spacing:-.045em;margin:7px 0}
  .pbanner p{color:var(--ink-soft)}
  .pbanner .pb-note{color:var(--ink-soft)}.pbanner .pb-note i{background:var(--warn)}
  .pshow{border-radius:var(--radius);box-shadow:var(--shadow)}
  .pshow-head{padding:18px 20px}.pshow-head .ps-name{font-size:15px}
  .wk-item{border-radius:7px;background:#FCFCFD}
  .wkform{background:#FAFAFB;border-radius:8px}
  .scrim{background:rgba(17,24,39,.55);backdrop-filter:blur(5px)}
  .modal{border-radius:14px}.modal-head h3{font-family:'Inter';font-weight:700}
  .toast{background:var(--nav);border-radius:8px}

  /* Interactive visual language — status never relies on colour alone. */
  .statusdot i{display:none}
  .statusdot:before,.wk-status:before,.callbadge:before,.afx:before{display:inline-block;margin-right:5px;font-weight:800;line-height:1}
  .sd-good:before,.wk-verified:before,.call-renew:before,.afx.ok:before{content:'✓'}
  .sd-warn:before,.wk-pending:before,.call-renegotiate:before,.afx.under:before{content:'◷'}
  .sd-bad:before,.wk-rejected:before,.call-exit:before{content:'!'}
  .sd-none:before,.wk-baseline:before,.afx.none:before{content:'–'}
  .call-evolve:before{content:'↗'}
  .sd-warn,.wk-pending,.att-pending{background-image:repeating-linear-gradient(135deg,rgba(195,131,24,.08) 0 4px,transparent 4px 8px)}
  .sd-bad,.wk-rejected,.att-off,.att-overdue{background-image:repeating-linear-gradient(135deg,rgba(190,30,45,.07) 0 4px,transparent 4px 8px)}

  /* Chart toolbar, interactive plot and export menu. */
  .perf-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .perf-view-toggle{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:#F7F8FA}
  .perf-view-toggle button{padding:5px 9px;border-radius:6px;font-size:10.5px;font-weight:650;color:var(--ink-soft)}
  .perf-view-toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.09)}
  .perf-export-menu{position:relative}
  .perf-export-menu>summary{list-style:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:11px;font-weight:700;padding:7px 10px;border-radius:8px}
  .perf-export-menu>summary::-webkit-details-marker{display:none}
  .perf-export-menu>summary:after{content:'⌄';color:var(--ink-faint);font-size:12px}
  .perf-export-menu[open]>summary{border-color:#C8CDD6;box-shadow:0 0 0 3px rgba(31,58,95,.08)}
  .perf-export-pop{position:absolute;right:0;top:calc(100% + 7px);z-index:12;width:188px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow-lg)}
  .perf-export-pop button{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:9px 10px;border-radius:7px;font-size:11.5px;color:var(--ink)}
  .perf-export-pop button:hover{background:var(--line-soft)}
  .perf-export-pop small{color:var(--ink-faint);font-size:9px;font-weight:650}
  .perf-chart{overflow:visible}
  .perf-bar{cursor:pointer;transform-box:fill-box;transform-origin:center bottom;animation:perfBarIn .22s cubic-bezier(.2,.75,.25,1) both;transition:filter .18s ease,opacity .18s ease,transform .18s ease}
  .perf-bar:hover,.perf-bar:focus{filter:drop-shadow(0 4px 5px rgba(16,24,40,.18));transform:translateY(-2px);outline:none}
  .perf-bar:focus rect{stroke:#111827;stroke-width:2.4}
  .perf-target-line{stroke:#111827;stroke-width:1.5;stroke-dasharray:5 4;opacity:.7}
  .perf-target-label{font-size:9px;font-weight:750;fill:#111827;letter-spacing:.04em}
  @keyframes perfBarIn{from{transform:scaleY(.03);opacity:.35}to{transform:scaleY(1);opacity:1}}

  /* Month exploration drawer. */
  .drawer-scrim{position:fixed;inset:0;z-index:70;background:rgba(17,24,39,.38);backdrop-filter:blur(2px);display:flex;justify-content:flex-end;animation:drawerFade .18s ease both}
  .perf-drawer{width:min(480px,94vw);height:100%;background:#fff;box-shadow:-18px 0 44px rgba(16,24,40,.18);display:flex;flex-direction:column;animation:drawerSlide .24s cubic-bezier(.2,.75,.25,1) both}
  .perf-drawer-head{padding:22px 24px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
  .perf-drawer-head .eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:800}
  .perf-drawer-head h3{font-family:'Space Grotesk';font-size:22px;letter-spacing:-.025em;margin:5px 0 2px}
  .perf-drawer-head p{font-size:12px;color:var(--ink-soft);margin:0}
  .drawer-close{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;font-size:20px;color:var(--ink-soft);flex:none}
  .drawer-close:hover{color:var(--ink);background:var(--line-soft)}
  .perf-drawer-body{padding:22px 24px 32px;overflow-y:auto}
  .drawer-kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;border:1px solid var(--line);background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
  .drawer-kpis div{background:#fff;padding:13px}
  .drawer-kpis span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:750}
  .drawer-kpis b{display:block;font-family:'JetBrains Mono';font-size:16px;margin-top:4px}
  .drawer-section{padding:16px 0;border-top:1px solid var(--line-soft)}
  .drawer-section h4{font-size:10px;text-transform:uppercase;letter-spacing:.065em;color:var(--ink-faint);margin:0 0 10px}
  .drawer-breakdown{display:grid;gap:8px}
  .drawer-breakdown div{display:flex;justify-content:space-between;gap:15px;font-size:12.5px}
  .drawer-breakdown b{font-family:'JetBrains Mono';font-weight:650}
  .drawer-assets{display:grid;gap:7px}.drawer-asset{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:7px;font-size:11.5px}
  .drawer-asset b{font-family:'JetBrains Mono'}
  .drawer-clips{display:grid;gap:7px}.drawer-clips a{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:7px;background:#F7F8FA;color:var(--accent);font-size:11.5px;text-decoration:none}.drawer-clips a:hover{background:#EEF1F5}
  .drawer-actions{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
  @keyframes drawerFade{from{opacity:0}to{opacity:1}}
  @keyframes drawerSlide{from{transform:translateX(28px);opacity:.75}to{transform:translateX(0);opacity:1}}

  /* Media Value now uses the same progressive-disclosure language as the chart drawer. */
  .media-comp{padding:0;overflow:hidden;background:#fff}
  .media-comp>summary{list-style:none;margin:0;padding:15px 16px;cursor:pointer;align-items:center}
  .media-comp>summary::-webkit-details-marker{display:none}
  .media-comp>summary:before{content:'›';color:var(--ink-faint);font-size:20px;line-height:1;margin-right:9px;transition:transform .2s ease}
  .media-comp[open]>summary:before{transform:rotate(90deg)}
  .media-comp>summary:hover{background:#FAFAFB}
  .media-comp-body{padding:14px 16px 17px;border-top:1px solid var(--line-soft);animation:mediaReveal .2s ease both}
  .media-comp .comp-name{font-size:14px}
  .media-comp .comp-editbtn{opacity:1}
  @keyframes mediaReveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  @media(prefers-reduced-motion:reduce){
    *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  }

  /* World-class progressive disclosure: decisions first, evidence on demand. */
  .pcard{min-height:310px;display:flex;flex-direction:column;padding:22px}
  .pcard .head{margin-bottom:10px}.pcard .name{font-size:19px}
  .pcard .verdict{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;margin:6px 0 17px;color:var(--ink-soft);font-size:13px}
  .pcard .metrics{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
  .pcard .cardfoot{border-top:0;padding-top:4px;margin-top:0}
  .pcard-decision{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .pcard-decision small{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:800}
  .pcard-open{font-size:10.5px;color:var(--ink-soft);font-weight:700;transition:transform .18s ease,color .18s ease}
  .pcard:hover .pcard-open{color:var(--brand);transform:translateX(3px)}

  .pulse-hero{padding:18px 20px 16px;background:linear-gradient(180deg,#fff,#FCFCFD)}
  .pulse-hero .pulse-status{margin-bottom:16px}
  .pulse-call{font-family:'Space Grotesk';font-size:18px;letter-spacing:-.02em}
  .pulse-compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pulse-factor{border:1px solid var(--line-soft);background:#fff;border-radius:9px;padding:11px;text-align:left;min-height:69px;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
  .pulse-factor:hover{border-color:#D2D7DF;transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,24,40,.05)}
  .pulse-factor:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .pulse-factor span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.065em;color:var(--ink-faint);font-weight:800}
  .pulse-factor b{display:block;margin-top:5px;font-family:'JetBrains Mono';font-size:13px}
  .pulse-disclosure{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px}
  .pulse-disclosure>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:750;color:var(--ink)}
  .pulse-disclosure>summary::-webkit-details-marker{display:none}
  .pulse-disclosure>summary span:last-child{color:var(--ink-faint);font-weight:600}
  .pulse-disclosure>summary:before{content:'›';font-size:18px;color:var(--ink-faint);transition:transform .2s ease}
  .pulse-disclosure[open]>summary:before{transform:rotate(90deg)}
  .pulse-detail{padding-top:13px;animation:mediaReveal .2s ease both}
  .pulse-detail .pulse-note{margin-top:0}
  .pulse-detail .pulse-evidence{border-top:0;padding-top:0}

  .media-comp{border-color:var(--line);transition:border-color .18s ease,box-shadow .18s ease}
  .media-comp:hover{border-color:#D1D6DE;box-shadow:0 7px 20px rgba(16,24,40,.045)}
  .media-comp>summary{position:relative;display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:20px;padding:17px 18px 17px 44px}
  .media-comp>summary:before{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
  .media-comp[open]>summary:before{transform:translateY(-50%) rotate(90deg)}
  .media-title-block{display:flex;align-items:center;min-width:0;gap:7px}
  .media-glance{display:flex;align-items:center;gap:14px}
  .media-glance-item{min-width:86px}
  .media-glance-item span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.065em;color:var(--ink-faint);font-weight:800}
  .media-glance-item b{display:block;margin-top:3px;font-family:'JetBrains Mono';font-size:12px}
  .mini-progress{--p:0;position:relative;width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex:none}
  .mini-progress:before{content:'';position:absolute;inset:5px;background:#fff;border-radius:50%}
  .mini-progress b{position:relative;font-family:'JetBrains Mono';font-size:9px}
  .media-comp-body{padding:18px}
  .asset-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
  .asset-summary div{padding:10px 11px;border-radius:8px;background:#F7F8FA}
  .asset-summary span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:800}
  .asset-summary b{display:block;margin-top:4px;font-family:'JetBrains Mono';font-size:13px}
  .asset-detail-toggle{margin-top:10px}
  .asset-detail-toggle>summary{list-style:none;cursor:pointer;font-size:10.5px;font-weight:750;color:var(--accent)}
  .asset-detail-toggle>summary::-webkit-details-marker{display:none}
  .asset-detail-toggle>summary:before{content:'＋';margin-right:6px;color:var(--ink-faint)}
  .asset-detail-toggle[open]>summary:before{content:'−'}
  .asset-detail-toggle .assetfulfil-strip{margin-top:10px}
  /* Ranked, pace-aware delivery matrix (behind-pace assets stay visible; on-track collapse). */
  .delivery-matrix{margin-top:13px}
  .dm-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 3px}
  .dm-head h4{font-family:'Inter';font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.055em;color:var(--ink-faint);margin:0}
  .dm-summary{font-size:11.5px;font-weight:700;color:var(--ink-soft)}
  .dm-summary .sev{color:var(--bad)} .dm-summary .ok{color:var(--good)}
  .dm-pace{font-size:10.5px;color:var(--ink-faint);margin:0 0 10px}
  .dm-row{display:grid;width:100%;grid-template-columns:15px minmax(0,1fr) 118px 78px;align-items:center;gap:11px;padding:8px 5px;border-top:1px solid var(--line-soft);border-radius:6px;text-align:left;transition:background .16s ease,transform .16s ease}
  .dm-row:first-of-type{border-top:0}
  .dm-row:hover{background:#F7F8FA;transform:translateX(2px)}
  .dm-row:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .dm-ico{width:15px;height:15px;font-size:10.5px;font-weight:800;text-align:center;line-height:15px;border-radius:50%}
  .dm-ico.behind{color:var(--bad);background:var(--bad-bg)} .dm-ico.complete{color:var(--good);background:var(--good-bg)}
  .dm-ico.ontrack,.dm-ico.none{color:var(--ink-faint)}
  .dm-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dm-row.ontrack .dm-name,.dm-row.none .dm-name{color:var(--ink-soft);font-weight:500}
  .dm-track{position:relative;height:7px;background:var(--track);border-radius:4px;overflow:visible}
  .dm-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transform-origin:left center;animation:dmGrow .5s cubic-bezier(.2,.7,.2,1) both}
  .dm-fill.behind{background:var(--bad)} .dm-fill.ontrack{background:#9AA3B2} .dm-fill.complete{background:var(--good)} .dm-fill.none{background:transparent}
  @keyframes dmGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .dm-pacemark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px;opacity:.75}
  .dm-pacemark::after{content:'';position:absolute;top:-3px;left:-2px;width:6px;height:3px;background:var(--ink);border-radius:0 0 2px 2px}
  .dm-fig{font-family:'JetBrains Mono';font-size:11.5px;text-align:right;white-space:nowrap;color:var(--ink)}
  .dm-fig b{font-weight:700}
  .dm-fig .pct{color:var(--ink-faint);font-weight:500;margin-left:4px}
  .dm-row.behind .dm-fig .pct{color:var(--bad)} .dm-row.complete .dm-fig .pct{color:var(--good)}
  .dm-row:after{content:'›';color:var(--ink-faint);position:absolute;right:-8px;opacity:0;transition:opacity .16s ease,transform .16s ease}
  .dm-row{position:relative}
  .dm-row:hover:after,.dm-row:focus-visible:after{opacity:1;transform:translateX(2px)}
  .dm-more{margin-top:2px}
  .dm-more>summary{list-style:none;cursor:pointer;font-size:10.5px;font-weight:750;color:var(--accent);padding:9px 0 2px;border-top:1px solid var(--line-soft)}
  .dm-more>summary::-webkit-details-marker{display:none}
  .dm-more>summary:before{content:'＋';color:var(--ink-faint);margin-right:6px}
  .dm-more[open]>summary:before{content:'−'}
  .pace-basis{display:inline-flex;align-items:center;gap:5px;margin-left:7px;padding:3px 7px;border-radius:999px;background:#F1F3F6;color:var(--ink-soft);font-size:9px;font-weight:700;white-space:nowrap}
  .evidence-status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .evidence-gap{font-family:'JetBrains Mono';font-size:11px;font-weight:700}
  .evidence-history{display:grid;gap:6px}
  .evidence-history-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:7px;font-size:11.5px}
  .evidence-history-row b{font-family:'JetBrains Mono'}
  .evidence-history-row small{color:var(--ink-faint)}
  .data-disclosure{margin-top:13px;border-top:1px solid var(--line-soft);padding-top:11px}
  .data-disclosure>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:750;color:var(--accent)}
  .data-disclosure>summary::-webkit-details-marker{display:none}
  .data-disclosure>summary:before{content:'＋';color:var(--ink-faint);margin-right:6px}
  .data-disclosure[open]>summary:before{content:'−'}

<script>
/* ============================================================
   STORAGE ADAPTER — preview uses window.storage.
   For the shared team build on GitHub Pages, replace load/save
   with Supabase, e.g.:
     load: async()=> (await sb.from('prs').select('doc').eq('id','main').single()).data?.doc
     save: async(doc)=> sb.from('prs').upsert({id:'main',doc})
   Nothing else in the app changes.
   ============================================================ */
/* ============================================================
   CONFIG
   Paste your Supabase anon public key below, then deploy.
   Until the key is filled in, the tool runs on local browser
   storage exactly as before (no login) — so it always works.
   ============================================================ */
const SUPABASE_URL = 'https://uboferpfurlnntryhrqv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVib2ZlcnBmdXJsbm50cnlocnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDQwMjcsImV4cCI6MjA5OTgyMDAyN30.86bSZHjKPibpdCDfFZrv2BDDkbq51QSc61Y-NaP3wq4'; /* anon public key */
const PREVIEW_MODE = false; // Live Supabase login: partner access is scoped to its published assignment.
const USE_SB = !PREVIEW_MODE && !!SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'PASTE_YOUR_ANON_KEY_HERE';
let SB = null;
if(USE_SB){ try{ SB = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ console.error('Supabase init failed',e); } }

const KEY='pba_partnership_review_v3';
function stripWeeks(doc){ const d=JSON.parse(JSON.stringify(doc)); (d.partnerships||[]).forEach(p=>(p.snapshots||[]).forEach(s=>((s.media&&s.media.components)||[]).forEach(c=>{delete c.weeks;}))); return d; }
/* Optimistic concurrency guard. docLoadedAt holds the updated_at of the pr_doc row as we last
   read (or successfully wrote) it. A save only lands if the row STILL carries that timestamp —
   so if another session (another tab, a colleague, your phone) saved in the meantime, our write
   is refused instead of silently overwriting their work. */
let docLoadedAt=null;
function docConflict(){ const e=new Error('This review was updated in another session since you loaded it.'); e.isConflict=true; return e; }

const db={
  async load(){
    if(SB){
      // Deliberately NOT caught here: a failed load must surface. Returning null on error would
      // make boot think the doc is empty and reseed — overwriting the real doc with seed data.
      const {data,error}=await SB.from('pr_doc').select('doc,updated_at').eq('id','main').maybeSingle();
      if(error) throw error;
      docLoadedAt = data ? data.updated_at : null;
      return data ? data.doc : null;
    }
    try{
      if(window.storage){ const r=await window.storage.get(KEY); return r?JSON.parse(r.value):null; }
      const r=localStorage.getItem(KEY); return r?JSON.parse(r):null;
    }catch(e){ console.error('local load failed',e); return null; }
  },
  async save(doc){
    if(SB){
      const payload={id:'main',doc:stripWeeks(doc),updated_at:new Date().toISOString()};
      if(docLoadedAt===null){
        // First write — no row loaded yet. Insert; a duplicate-key means someone created it first.
        const {data,error}=await SB.from('pr_doc').insert(payload).select('updated_at').maybeSingle();
        if(error){ if(error.code==='23505') throw docConflict(); throw error; }
        docLoadedAt = data ? data.updated_at : payload.updated_at;
        return;
      }
      // Conditional update: only overwrites the exact version we loaded. Zero rows back = a newer
      // save landed first, so we refuse rather than clobber it.
      const {data,error}=await SB.from('pr_doc').update(payload).eq('id','main').eq('updated_at',docLoadedAt).select('updated_at');
      if(error) throw error;
      if(!data||!data.length) throw docConflict();
      docLoadedAt = data[0].updated_at;
      return;
    }
    if(window.storage) await window.storage.set(KEY,JSON.stringify(doc));
    else localStorage.setItem(KEY,JSON.stringify(doc));
  }
};

let STATE=null;
let view={screen:'board',pid:null,sid:null,filter:'all',mode:'internal',partnerPid:null,role:null,email:null,module:'overview',benchmarkBasis:'portfolio'};
const CATEGORIES=['Racing','AFL','NRL','US Sports','Soccer','Other'];
const CALLS=['renew','evolve','renegotiate','exit'];
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* Generates the month-picker list from a partnership's own term dates (Mar 2026 – Oct 2026 style
   labels), so each partner only ever sees months that actually fall within their contract term —
   instead of one hardcoded range that only happened to fit FanaticsTV. Falls back to a generic
   12-month-from-now window if term dates aren't set, so the form never has a truly empty picker. */
function monthOptionsFor(p){
  const fallback=(()=>{ const now=new Date(),opts=[]; for(let i=0;i<12;i++){ const d=new Date(now.getFullYear(),now.getMonth()+i,1); opts.push(MONTH_NAMES[d.getMonth()]+' '+d.getFullYear()); } return opts; })();
  if(!p||!p.termStart||!p.termEnd) return fallback;
  const start=new Date(p.termStart+'T00:00'), end=new Date(p.termEnd+'T00:00');
  if(isNaN(start)||isNaN(end)||end<start) return fallback;
  const opts=[]; let y=start.getFullYear(), m=start.getMonth();
  const endY=end.getFullYear(), endM=end.getMonth();
  while(y<endY || (y===endY && m<=endM)){ opts.push(MONTH_NAMES[m]+' '+y); m++; if(m>11){m=0;y++;} }
  return opts.length?opts:fallback;
}
const LEVERS=[['growth','Growth'],['audience','Audience'],['channels','Channels & coverage'],['compliance','Compliance']];
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- helpers ---------- */
const n=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;
function money(v){ if(v===null||v===''||isNaN(+v))return '—'; const x=+v;
  if(Math.abs(x)>=1000000)return '$'+(x/1000000).toFixed(x%1000000===0?1:2).replace(/\.0$/,'')+'M';
  if(Math.abs(x)>=1000)return '$'+(x/1000).toFixed(0)+'k'; return '$'+x.toLocaleString(); }
function moneyFull(v){ if(v===null||v==='')return '—'; return '$'+(+v).toLocaleString(); }
function aud(v){ if(v===null||v==='')return '—'; const x=+v;
  if(Math.abs(x)>=1000000)return (x/1000000).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(Math.abs(x)>=1000)return (x/1000).toFixed(0)+'k'; return x.toLocaleString(); }
function num(v){ if(v===null||v==='')return '—'; return (+v).toLocaleString(); }
function pctDiff(a,e){ const A=n(a),E=n(e); if(A===null||E===null||E===0)return null; return Math.round((A-E)/Math.abs(E)*100); }
function cpm(inv,audience){ const i=n(inv),a=n(audience); if(i===null||a===null||a===0)return null; return i/(a/1000); }

function latestSnap(p){ return p.snapshots[p.snapshots.length-1]; }
/* The active product is a current-year operating view. Historical review points remain stored
   for future year-based reporting, but the interface always opens the latest current record. */
function currentSnap(p){ return latestSnap(p); }
function curSnap(){ const p=STATE.partnerships.find(x=>x.id===view.pid); return currentSnap(p); }

/* weekly log helpers */
function weeksOf(c){ return c.weeks||[]; }
function weekAudTotal(w){ return Object.values(w.audience||{}).reduce((a,b)=>a+(+b||0),0); }
function deliveredFromWeeks(c){ const ws=dedupedVerifiedWeeks(c); if(!ws.length)return null; return ws.reduce((a,w)=>a+weekAudTotal(w),0); }
function weeksLogged(c){ return weeksOf(c).length; }
function distinctLabelsLogged(c){ return new Set(weeksOf(c).map(w=>w.label)).size; }
function assetDeliveredTotal(c,assetId){ return weeksOf(c).reduce((a,w)=>a+(+((w.assets||{})[assetId])||0),0); }
/* Verified-only variants — used anywhere a figure is meant to agree with the entitlement panel,
   which counts only submissions PointsBet has verified (pending submissions are excluded).
   dedupedVerifiedWeeks collapses to ONE row per month label (the most recently submitted wins) —
   a corrected resubmission for a month replaces the old figure instead of adding on top of it. */
function dedupedVerifiedWeeks(c){
  const byLabel={};
  weeksOf(c).filter(w=>w.status==='verified').forEach(w=>{
    const existing=byLabel[w.label];
    if(!existing || (w.submittedAt||'')>=(existing.submittedAt||'')) byLabel[w.label]=w;
  });
  return Object.values(byLabel);
}
function verifiedWeeksOf(c){ return dedupedVerifiedWeeks(c); }
function verifiedWeeksLogged(c){ return dedupedVerifiedWeeks(c).length; }
function verifiedAssetDeliveredTotal(c,assetId){ return dedupedVerifiedWeeks(c).reduce((a,w)=>a+(+((w.assets||{})[assetId])||0),0); }
function latestCumulativeWeek(c,verifiedOnly=true){
  const rows=(verifiedOnly?dedupedVerifiedWeeks(c):weeksOf(c).slice()).filter(w=>w&&w.label);
  rows.sort((a,b)=>{
    const am=parseMonthKey(a.label),bm=parseMonthKey(b.label);
    if(am!==null&&bm!==null&&am!==bm)return am-bm;
    return (a.submittedAt||'').localeCompare(b.submittedAt||'');
  });
  return rows.length?rows[rows.length-1]:null;
}
function cumulativeAssetDelivered(c,asset,verifiedOnly=true){
  const latest=latestCumulativeWeek(c,verifiedOnly);
  const raw=latest&&latest.assets?latest.assets[asset.id]:undefined;
  if(raw!==undefined&&raw!==null&&raw!=='')return +raw||0;
  const baseline=asset?asset.baselineDelivered:null;
  return baseline===''||baseline===null||baseline===undefined?null:(+baseline||0);
}
function parseSubmissionNote(note){
  const text=(note||'').trim();
  const sourceMatch=text.match(/(?:^|\n)Source:\s*(.*?)(?=\nComments:|$)/i);
  const commentsMatch=text.match(/(?:^|\n)Comments:\s*([\s\S]*)$/i);
  if(sourceMatch||commentsMatch)return {source:(sourceMatch&&sourceMatch[1].trim())||'',comments:(commentsMatch&&commentsMatch[1].trim())||''};
  return {source:'',comments:text};
}
function formatSubmissionNote(source,comments){
  return `Source: ${(source||'').trim()}${comments&&comments.trim()?`\nComments: ${comments.trim()}`:''}`;
}
function storedClipPath(value){ return typeof value==='string'&&value.startsWith('storage:')?value.slice(8):null; }
/* Only ever hand back an http(s)/blob URL. Anything else (a javascript:/data: value injected into
   a partner-submitted asset row) collapses to '', so it can never be rendered as a live link. */
function safeUrl(u){ u=(u||'').trim(); return (/^https?:\/\//i.test(u)||/^blob:/i.test(u))?u:''; }
function clipHref(w,assetId){
  if(!w||!w.assets)return '';
  const signed=w.assets[assetId+'__clip__signed'];
  if(signed) return safeUrl(signed);
  const raw=w.assets[assetId+'__clip']||'';
  return raw.startsWith('http')?safeUrl(raw):'';
}
function reportHref(w){
  if(!w||!w.assets)return '';
  const signed=w.assets.__report__signed;
  if(signed)return safeUrl(signed);
  const raw=w.assets.__report||'';
  return raw.startsWith('http')?safeUrl(raw):'';
}
async function hydrateClipUrls(){
  if(!SB||!STATE)return;
  const jobs=[];
  (STATE.partnerships||[]).forEach(p=>(p.snapshots||[]).forEach(s=>((s.media&&s.media.components)||[]).forEach(c=>weeksOf(c).forEach(w=>{
    const reportPath=storedClipPath((w.assets||{}).__report);
    if(reportPath)jobs.push(SB.storage.from('pr-clips').createSignedUrl(reportPath,3600).then(({data,error})=>{
      if(!error&&data&&data.signedUrl)w.assets.__report__signed=data.signedUrl;
      else if(error)console.warn('report signed-url failed for',reportPath,error);
    }).catch(err=>console.warn('report signed-url error for',reportPath,err)));
    (c.assets||[]).forEach(as=>{
      const raw=(w.assets||{})[as.id+'__clip'];
      const path=storedClipPath(raw);
      if(!path)return;
      jobs.push(SB.storage.from('pr-clips').createSignedUrl(path,3600).then(({data,error})=>{
        if(!error&&data&&data.signedUrl)w.assets[as.id+'__clip__signed']=data.signedUrl;
        else if(error)console.warn('clip signed-url failed for',path,error);
      }).catch(err=>console.warn('clip signed-url error for',path,err)));
    });
  }))));
  await Promise.all(jobs);
}
/* One source of truth for the performance graph and all YTD calculations.
   Imported history remains the official basis until a submitted correction is verified. A verified
   correction replaces that same month everywhere; pre-sponsorship baseline months remain visible
   but are excluded from delivered YTD and CPM. */
function performanceDelivery(c,p){
  const staticM=(typeof MONTHLY!=='undefined'&&p)?MONTHLY[p.name]:null;
  const staticMonths=staticM?staticM.months.slice():[];
  const staticKey=staticShowKey(staticM,c.name);
  const staticShow=staticKey?staticM.shows[staticKey]:null;
  const data=staticShow?{...staticShow.data}:{};
  const baselineUntil=staticShow?staticShow.baselineUntil:null;
  const live=liveShowMonthly(c).data;
  Object.entries(live).forEach(([mo,d])=>{ const matched=staticMonths.find(sm=>monthMatches(sm,mo)); data[matched||mo]=d; });
  const baselineIndex=baselineUntil?staticMonths.indexOf(baselineUntil):-1;
  const counted=Object.entries(data).filter(([mo])=>{
    const i=staticMonths.indexOf(mo);
    return !(baselineIndex>=0&&i>=0&&i<=baselineIndex);
  });
  if(!counted.length) return {total:null,months:0};
  return {
    total:counted.reduce((sum,[,d])=>sum+Object.values(d||{}).reduce((a,v)=>a+(+v||0),0),0),
    months:counted.length
  };
}
function canonicalShowName(name){
  return (name||'').toLowerCase().replace(/\s*\([^)]*\)\s*$/,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function staticShowKey(staticM,name){
  if(!staticM||!staticM.shows)return null;
  if(staticM.shows[name])return name;
  const wanted=canonicalShowName(name);
  return Object.keys(staticM.shows).find(k=>canonicalShowName(k)===wanted)||null;
}
function deliveryMonthsLogged(c,p){
  const perf=performanceDelivery(c,p);
  return perf.months||(+c.baselineMonthsElapsed||0);
}
function audDelivered(c,p){
  const perf=performanceDelivery(c,p);
  if(perf.total!==null)return perf.total;
  const baseline=n(c.baselineAudienceYtd);
  return baseline!==null?baseline:n(c.audienceDelivered);
}

/* Contract term length in whole calendar months (inclusive) — used to spread investment evenly
   across the term so Delivered CPM can be compared against a matching period of spend. */
function termMonths(p){
  if(!p||!p.termStart||!p.termEnd) return null;
  const a=new Date(p.termStart+'T00:00'), b=new Date(p.termEnd+'T00:00');
  if(isNaN(a)||isNaN(b)||b<a) return null;
  return Math.max(1,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+1);
}
/* media roll-up for a snapshot.
   p (optional) enables period-matched Delivered CPM: investment is spread evenly across the
   contract term, and only the portion covering the months actually verified-and-delivered is
   compared against the audience delivered in those same months. Without p, delCpm falls back to
   full-term investment ÷ cumulative delivered (the old, coarser method) — used only where a
   partnership isn't available to look up term dates from. Proposed CPM is never period-matched:
   it's the fixed deal economics agreed at signing, and is the benchmark delivered CPM is judged against. */
function mediaRoll(s,p){
  let inv=0,guar=0,del=0,hasAud=false,hasInv=false;
  let spendToDate=0,hasSpendToDate=false;
  let reportedInv=0,reportedGuar=0,hasReportedBenchmark=false;
  const totalMonths=termMonths(p);
  (s.media.components||[]).forEach(c=>{
    const ci=n(c.investment); if(ci!==null){inv+=ci;hasInv=true;}
    if(c.mode==='audience'){
      const g=n(c.audienceGuaranteed),d=audDelivered(c,p);
      if(g!==null){guar+=g;hasAud=true;} if(d!==null)del+=d;
      if(d!==null&&ci!==null&&g!==null){reportedInv+=ci;reportedGuar+=g;hasReportedBenchmark=true;}
      if(ci!==null&&totalMonths){ const monthsLogged=Math.min(deliveryMonthsLogged(c,p),totalMonths);
        if(monthsLogged>0){ spendToDate+=(ci/totalMonths)*monthsLogged; hasSpendToDate=true; } }
    }
  });
  const delCpmPeriod=(hasSpendToDate&&del)?cpm(spendToDate,del):null;
  return { inv:hasInv?inv:null, guar:hasAud?guar:null, del:del||null, hasAud,
    propCpm:(hasInv&&guar)?cpm(inv,guar):null,
    delCpmBenchmark:hasReportedBenchmark&&reportedGuar?cpm(reportedInv,reportedGuar):null,
    reportedInv:hasReportedBenchmark?reportedInv:null, reportedGuar:hasReportedBenchmark?reportedGuar:null,
    delCpm: delCpmPeriod!==null?delCpmPeriod:((hasInv&&del)?cpm(inv,del):null),
    spendToDate: hasSpendToDate?spendToDate:null, periodMatched: delCpmPeriod!==null };
}
function audienceTargetYtd(s,p){
  const totalMonths=termMonths(p);
  if(!totalMonths)return null;
  let target=0,hasTarget=false;
  (s.media.components||[]).filter(c=>c.mode==='audience').forEach(c=>{
    const g=n(c.audienceGuaranteed),months=deliveryMonthsLogged(c,p),d=audDelivered(c,p);
    if(g===null)return;
    const explicitTarget=n(c.baselineAudienceTargetYtd);
    if(explicitTarget!==null){target+=explicitTarget;hasTarget=true;}
    else if(months>0){ target+=g*Math.min(months,totalMonths)/totalMonths; hasTarget=true; }
    else if(d!==null){ target+=g; hasTarget=true; } // legacy delivered snapshots without monthly history
  });
  return hasTarget?target:null;
}
/* delivered "value realised" for fixed / fulfilment components (dollar sense) */
function compRealised(c){
  const inv=n(c.investment)||0;
  if(c.mode==='fixed') return c.fixedDelivered?inv:0;
  if(c.mode==='fulfilment'){ const d=n(c.deliveredQty),ct=n(c.contractedQty); if(d===null||!ct)return null; return inv*Math.min(d/ct,1); }
  return null; // audience handled via CPM/reach
}

/* A failed save must never look like a successful one. On failure we tell the truth via a toast
   and re-throw, which aborts the caller's success path (closeModal / render / "Saved") — the modal
   stays open so the change can be retried, and a conflict tells the user to reload first. */
async function persist(){
  try{
    await db.save(STATE);
  }catch(e){
    if(e&&e.isConflict){
      toast("Not saved — someone else changed this review. Reload before editing so you don't overwrite their work.",6500);
    }else{
      console.error('save failed',e);
      toast('Save failed — your change did NOT save. '+((e&&e.message)?e.message:'Check your connection and try again.'),6500);
    }
    throw e;
  }
}
function toast(m,ms){ const t=document.getElementById('toastMount'); if(!t)return; t.innerHTML='<div class="toast"></div>'; t.firstChild.textContent=m; clearTimeout(t._t); t._t=setTimeout(()=>{t.innerHTML='';},ms||1900); }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d)return ''; return new Date(d+'T00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}); }

function bar(act,exp,big){
  const a=n(act),e=n(exp);
  if(a===null&&e===null)return `<div class="bar ${big?'big':''}"></div>`;
  const max=Math.max(a||0,e||0)*1.15||1;
  let cls='mid'; if(a!==null&&e!==null)cls=a>=e?'pos':(a>=e*0.85?'mid':'neg');
  return `<div class="bar ${big?'big':''}"><div class="fill ${cls}" style="width:${Math.min((a||0)/max*100,100)}%"></div>${e!==null?`<div class="tick" style="left:${Math.min((e||0)/max*100,100)}%"></div>`:''}</div>`;
}
/* bar where LOWER is better (CPM): fill green if act<=exp */
function barInverse(act,exp){
  const a=n(act),e=n(exp); if(a===null)return `<div class="bar"></div>`;
  const max=Math.max(a,e||0)*1.15||1;
  const cls=(e!==null)?(a<=e?'pos':(a<=e*1.15?'mid':'neg')):'mid';
  return `<div class="bar"><div class="fill ${cls}" style="width:${Math.min(a/max*100,100)}%"></div>${e!==null?`<div class="tick" style="left:${Math.min(e/max*100,100)}%"></div>`:''}</div>`;
}

function partnershipAttention(p){
  // returns {pending:n, overdue:[showNames], offTrack:bool} for the latest snapshot
  const s=latestSnap(p); const comps=(s.media.components||[]).filter(c=>c.mode==='audience');
  const nowLabel=currentMonthLabel(); const inTerm=monthOptionsFor(p).includes(nowLabel);
  let pending=0; const overdue=[];
  comps.forEach(c=>{
    (weeksOf(c)||[]).forEach(w=>{ if((w.status||'pending')!=='verified') pending++; });
    if(inTerm){ const logged=new Set(weeksOf(c).map(w=>w.label)); if(!logged.has(nowLabel)) overdue.push(c.name); }
  });
  return {pending,overdue,offTrack:currentPulse(p,s).status==='bad'};
}

    </div>`;
  const va=n(s.media.valueAdd);
  const overDel=(m.hasAud&&m.del!==null&&m.guar!==null&&m.del>m.guar)?(m.del-m.guar):null;
  const isFoxTracked=p.id==='fox-footy-afl-2026';
  const investmentFoot=isFoxTracked
    ?`${money(p.contractedValue)} partnership · ${money(m.inv)} tracked`
    :(m.inv!==null?money(m.inv)+' invested':'—');
  return `<div class="pcard ${st}" role="button" tabindex="0" aria-label="Open ${esc(p.name)} partnership review" onclick="openDetail('${p.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetail('${p.id}')}">

function platformBucket(name){
  if(name==='YouTube')return 'yt';
  if(/audio|acast|spotify|apple/i.test(name||''))return 'ac';
  if(/linear|television|commercial impressions|\btv\b/i.test(name||''))return 'linear';
  return 'soc';
}
function parseMonthKey(lbl){ const d=new Date(lbl); const t=d.getTime(); return isNaN(t)?null:t; }

function liveShowMonthly(comp){
  const data={}, tiktok={};
  dedupedVerifiedWeeks(comp).forEach(w=>{
    const mo=w.label; if(!mo) return;
    const bucket=data[mo]||(data[mo]={yt:0,soc:0,ac:0,linear:0});
    Object.entries(w.audience||{}).forEach(([plat,v])=>{
      const val=+v||0; bucket[platformBucket(plat)]+=val;
      if(plat==='TikTok') tiktok[mo]=(tiktok[mo]||0)+val;
    });
  });
  return {data,tiktok};
}
function pendingShowMonthly(comp){

    const existing=byLabel[w.label];

    Object.entries(w.audience||{}).forEach(([plat,v])=>{bucket[platformBucket(plat)]+=+v||0;});
  });
  return data;
}
/* ============================================================ MONTHLY PERFORMANCE — EXPORTABLE CHART ============================================================
   buildPerfChartSVG produces a standalone, deck-ready SVG (baked title, KPI strip, legend, attribution
   and footnote) from the same model the on-screen chart draws, so PNG/SVG exports are WYSIWYG. The
   on-screen chart keeps its interactive controls; export reads the model the panel stashes on render. */
function niceMax(raw){
  // ~10% headroom above the tallest bar, rounded up to a clean number so the top gridline sits just
  // above the data rather than miles above it.
  if(raw<=0)return 1;
  const target=raw*1.1;
  const pow=Math.pow(10,Math.floor(Math.log10(target)));
  const n=target/pow;
  const steps=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];
  const step=steps.find(s=>s>=n)||10;
  return step*pow;
}
function perfRawValue(m,d){
  if(!d)return null;
  return m.metric==='total'?Object.values(d).reduce((sum,v)=>sum+(+v||0),0):(+d[m.metric]||0);
}
function perfIsBaseline(m,show,index){
  const b=m.shows[show]&&m.shows[show].baselineUntil;
  return !!(b&&index<=m.months.indexOf(b));
}
function perfCumulative(m,show,index,includePending){
  let total=0,has=false;
  for(let i=0;i<=index;i++){
    if(perfIsBaseline(m,show,i))continue;
    const mo=m.months[i];
    const v=perfRawValue(m,m.shows[show].data[mo]);
    if(v!==null){total+=v;has=true;}
    if(includePending){
      const pv=perfRawValue(m,(m.shows[show].pending||{})[mo]);
      if(pv!==null){total+=pv;has=true;}
    }
  }
  return has?total:null;
}
function perfHasPendingThrough(m,show,index){
  for(let i=0;i<=index;i++){
    if(perfIsBaseline(m,show,i))continue;
    if(perfRawValue(m,(m.shows[show].pending||{})[m.months[i]])!==null)return true;
  }
  return false;
}
function perfTargetAt(m,show,index){
  const target=m.targets&&m.targets[show];
  if(!target)return null;
  if(target.targetByMonth){
    let exact=0,has=false;
    for(let i=0;i<=index;i++){
      if(perfIsBaseline(m,show,i))continue;
      const v=+target.targetByMonth[m.months[i]];
      if(Number.isFinite(v)){exact+=v;has=true;}
    }
    if(has)return exact;
  }
  if(!target.guarantee||!target.termMonths)return null;
  let elapsed=0;
  for(let i=0;i<=index;i++)if(!perfIsBaseline(m,show,i))elapsed++;
  return target.guarantee*Math.min(elapsed,target.termMonths)/target.termMonths;
}
function perfTargetMonthAt(m,show,index){
  const target=m.targets&&m.targets[show];
  if(!target)return null;
  if(target.targetByMonth){
    const v=+target.targetByMonth[m.months[index]];
    return Number.isFinite(v)?v:null;
  }
  if(!target.guarantee||!target.termMonths)return null;
  return target.guarantee/target.termMonths;
}
function perfProjectedDeliveredMode(m){
  return /Fox Footy/i.test(m.partnershipName||'') && (m.viewMode||'monthly')==='target';
}
function perfPoint(m,show,index,pending){
  const mode=m.viewMode||'monthly',mo=m.months[index];
  if(mode==='monthly')return perfRawValue(m,pending?(m.shows[show].pending||{})[mo]:m.shows[show].data[mo]);
  const verified=perfCumulative(m,show,index,false);
  const projected=pending?perfCumulative(m,show,index,true):verified;

}
