  if(spec.showPending!==false)stateKey(x=>`<rect x="${x}" y="${legY2-9}" width="14" height="12" rx="2.5" fill="url(#pendingHatch)" stroke="${C.amber}" stroke-width="1.6" stroke-dasharray="4 2.5"/>`,'pending · not counted');
  stateKey(x=>`<rect x="${x}" y="${legY2-9}" width="14" height="12" rx="2.5" fill="url(#baselineHatch)" stroke="${C.ink}" stroke-dasharray="3 2"/>`,'pre-sponsorship baseline');

  // footer
  if(spec.showPending!==false)g+=`<text x="${W-padR}" y="${H-13}" text-anchor="end" font-family="${F.body}" font-size="9.5" fill="${C.faint}">Pending delivery is visible but excluded from verified YTD totals, CPM and the Partnership Pulse.</text>`;

  const statusDescription=spec.showPending!==false?'Solid bars are verified, hatched amber bars are pending, and grey hatched bars are pre-sponsorship baseline.':'Solid bars are verified and grey hatched bars are pre-sponsorship baseline. Pending submissions are hidden in this export.';
  return `<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="perfExportTitle perfExportDesc" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${F.body}"><title id="perfExportTitle">${esc(partnershipName)} monthly performance</title><desc id="perfExportDesc">${esc(metricLabel)} shown from ${esc(months[0])} to ${esc(months[months.length-1])}. ${statusDescription}</desc>${g}</svg>`;
}

/* --- export + data-table plumbing — all derive from the model the panel stashed, so they respect the
   current show filter and metric exactly as drawn --- */
function perfRows(m){
  const val=d=>!d?null:(m.metric==='total'?Object.values(d).reduce((sum,v)=>sum+(+v||0),0):d[m.metric]);
  return m.months.map((mo,i)=>{
    const cells=m.order.map(s=>{
      const sh=m.shows[s]; const isB=sh.baselineUntil&&i<=m.months.indexOf(sh.baselineUntil);
      const v=val(sh.data[mo]); const pv=val((sh.pending||{})[mo]);
      let status='none',value=null;
      if(v!==null){ status=isB?'baseline':'verified'; value=v; }
      else if(pv!==null){ status='pending'; value=pv; }
      return {show:s,status,value};
    });
    const total=cells.filter(c=>c.status==='verified').reduce((t,c)=>t+c.value,0);
    return {label:mo, cells, total:cells.some(c=>c.status==='verified')?total:null};
  });
}
function perfTableHTML(m){
  if(perfProjectedDeliveredMode(m)){
    const rows=m.months.map((mo,i)=>{
      const projected=m.order.reduce((t,s)=>t+(perfTargetMonthAt(m,s,i)||0),0);
      const delivered=m.order.reduce((t,s)=>t+(perfRawValue(m,m.shows[s].data[mo])||0),0);
      const hasDelivered=m.order.some(s=>perfRawValue(m,m.shows[s].data[mo])!==null);
      const pct=projected&&hasDelivered?Math.round(delivered/projected*100):null;
      return {label:mo,projected:projected||null,delivered:hasDelivered?delivered:null,pct};
    });
    return `<details class="perf-table"><summary>Data table &amp; export figures</summary>
      <div style="margin-top:10px"><button class="perf-x" onclick="copyPerfData()">Copy for Excel</button>
      <table class="dtable" style="margin-top:8px"><thead><tr><th>Month</th><th class="num">Projected</th><th class="num">Delivered</th><th class="num">Delivery</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.label)}</td><td class="num">${r.projected!==null?aud(r.projected):'—'}</td><td class="num"><b>${r.delivered!==null?aud(r.delivered):'—'}</b></td><td class="num">${r.pct!==null?`<b style="color:var(--${r.pct>=100?'good':'warn'})">${r.pct}%</b>`:'—'}</td></tr>`).join('')}
      </tbody></table>
      <div style="margin-top:6px;font-size:11px;color:var(--ink-faint)">Projected is the monthly proposed audience from the Foxtel tracking file; delivered is the verified monthly 30-second audience.</div></div></details>`;
  }
  const rows=perfRows(m);
  const head=`<tr><th>Month</th>${m.order.map(s=>`<th class="num">${esc(s)}</th>`).join('')}<th class="num">Total</th></tr>`;
  const body=rows.map(r=>`<tr><td>${esc(r.label)}</td>${r.cells.map(c=>{
    if(c.status==='none') return '<td class="num" style="color:var(--ink-faint)">—</td>';
    const tag=c.status==='pending'?' <span style="color:#9A6609;font-size:9px;font-weight:700">PENDING</span>':c.status==='baseline'?' <span style="color:#B49C6A;font-size:9px">baseline</span>':'';
    const col=c.status==='verified'?'var(--ink)':c.status==='pending'?'#9A6609':'#B49C6A';
    return `<td class="num" style="color:${col}">${aud(c.value)}${tag}</td>`;
  }).join('')}<td class="num"><b>${r.total!==null?aud(r.total):'—'}</b></td></tr>`).join('');
  return `<details class="perf-table"><summary>Data table &amp; export figures</summary>
    <div style="margin-top:10px"><button class="perf-x" onclick="copyPerfData()">Copy for Excel</button>
    <table class="dtable" style="margin-top:8px"><thead>${head}</thead><tbody>${body}</tbody></table>
    <div style="margin-top:6px;font-size:11px;color:var(--ink-faint)">Total is verified (counted) figures only. Pending and pre-sponsorship baseline are shown for context but excluded from the total.</div></div></details>`;
}
function perfDataTSV(){
  const m=view._chartModel; if(!m||!m.order||!m.order.length)return '';
  if(perfProjectedDeliveredMode(m)){
    const header=['Month','Projected','Delivered','Delivery %'].join('\t');
    const lines=m.months.map((mo,i)=>{
      const projected=m.order.reduce((t,s)=>t+(perfTargetMonthAt(m,s,i)||0),0);
      const delivered=m.order.reduce((t,s)=>t+(perfRawValue(m,m.shows[s].data[mo])||0),0);
      const hasDelivered=m.order.some(s=>perfRawValue(m,m.shows[s].data[mo])!==null);
      const pct=projected&&hasDelivered?Math.round(delivered/projected*100):'';
      return [mo,projected||'',hasDelivered?delivered:'',pct].join('\t');
    });
    return `Monthly performance\t${m.partnershipName}\tProjected vs delivered\n${header}\n${lines.join('\n')}`;
  }
  const rows=perfRows(m);
  const header=['Month',...m.order,'Total (verified)'].join('\t');
  const lines=rows.map(r=>[r.label,...r.cells.map(c=>c.value!==null?c.value:''),r.total!==null?r.total:''].join('\t'));
  const caveat=rows.some(r=>r.cells.some(c=>c.status!=='verified'&&c.status!=='none'))
    ? '\n\nNote: values are raw figures. Pending and pre-sponsorship baseline months are excluded from the verified Total.' : '';
  return `Monthly performance\t${m.partnershipName}\t${m.metricLabel}\n${header}\n${lines.join('\n')}${caveat}`;
}
function fmtToday(){ try{ return new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return new Date().toISOString().slice(0,10); } }
function perfChartSpec(){
  const m=view._chartModel; if(!m||!m.order||!m.order.length)return null;
  return { months:m.months, shows:m.shows, order:m.order, colors:m.colors, metric:m.metric, metricLabel:m.metricLabel, partnershipName:m.partnershipName, asAt:fmtToday(),viewMode:m.viewMode,targets:m.targets,showPending:m.showPending };
}
function perfChartToSvgString(){ const s=perfChartSpec(); return s?buildPerfChartSVG(s):''; }
function downloadBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
function perfFileName(ext){ const m=view._chartModel; const nm=((m&&m.partnershipName)||'partnership').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,''); return `${nm}-monthly-performance-${new Date().toISOString().slice(0,10)}.${ext}`; }
async function downloadPerfSvg(){ const svg=perfChartToSvgString(); if(!svg){toast('No chart to export yet');return;} downloadBlob(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),perfFileName('svg')); toast('Chart exported (SVG)'); }
async function downloadPerfPng(){
  const svg=perfChartToSvgString(); if(!svg){toast('No chart to export yet');return;}
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const scale=2;
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    try{
      const w=img.naturalWidth||1200, h=img.naturalHeight||675;
      const canvas=document.createElement('canvas'); canvas.width=w*scale; canvas.height=h*scale;
      const ctx=canvas.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.setTransform(scale,0,0,scale,0,0); ctx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      canvas.toBlob(b=>{ if(!b){toast('PNG export failed');return;} downloadBlob(b,perfFileName('png')); toast('Chart exported (PNG)'); },'image/png');
    }catch(e){ URL.revokeObjectURL(url); console.error('png export',e); toast('PNG export failed: '+(e.message||'')); }
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('PNG export failed'); };
  img.src=url;
}
async function copyPerfData(){
  const tsv=perfDataTSV(); if(!tsv){toast('No data to copy');return;}
  try{ await navigator.clipboard.writeText(tsv); toast('Copied — paste into Excel'); return; }catch(e){/* fall through */}
  try{ const ta=document.createElement('textarea'); ta.value=tsv; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); toast(ok?'Copied — paste into Excel':'Copy failed'); }
  catch(e){ toast('Copy failed'); }
}
Object.assign(window,{downloadPerfPng,downloadPerfSvg,copyPerfData});


function monthlyGraphPanel(p){
  const s=currentSnap(p);
  const staticM=MONTHLY[p.name];
  const staticMonths=staticM?staticM.months.slice():[];
  const staticShows=staticM?staticM.shows:{};
  const staticTiktok=staticM?staticM.tiktok:{};

  /* merge: imported months stay official until a correction is verified. Pending corrections are
     shown as pending evidence; verified corrections replace the matching imported month. */
  const shows={};
  Object.keys(staticShows).forEach(nm=>{ shows[nm]={ baselineUntil:staticShows[nm].baselineUntil, data:{...staticShows[nm].data}, pending:{} }; });
  const liveTiktok={};
  (s.media.components||[]).filter(c=>c.mode==='audience'&&(c.platforms||[]).length).forEach(c=>{
    const {data:liveData,tiktok:liveTk}=liveShowMonthly(c);
    const pendingData=pendingShowMonthly(c);
    const showKey=staticShowKey(staticM,c.name)||c.name;
    const normaliseMonth=mo=>staticMonths.find(sm=>monthMatches(sm,mo))||mo;
    const newMonths=Object.keys(liveData);
    const pendingMonths=Object.keys(pendingData);
    if(newMonths.length||pendingMonths.length){ if(!shows[showKey])shows[showKey]={baselineUntil:null,data:{},pending:{}}; }
    newMonths.forEach(mo=>{ shows[showKey].data[normaliseMonth(mo)]=liveData[mo]; });
    pendingMonths.forEach(mo=>{ shows[showKey].pending[normaliseMonth(mo)]=pendingData[mo]; });
    if(!shows[showKey] && (Object.keys(liveData).length||Object.keys(pendingData).length)){ shows[showKey]={baselineUntil:null,data:{},pending:{}}; }
    Object.entries(liveTk).forEach(([mo,v])=>{ const key=normaliseMonth(mo); liveTiktok[key]=(liveTiktok[key]||0)+v; });
  });
  const showNames=Object.keys(shows);
  if(!showNames.length) return '';

  const liveMonthSet=new Set();
  showNames.forEach(nm=>{
    Object.keys(shows[nm].data).forEach(mo=>{ if(!staticMonths.includes(mo)) liveMonthSet.add(mo); });
    Object.keys(shows[nm].pending||{}).forEach(mo=>{ if(!staticMonths.includes(mo)) liveMonthSet.add(mo); });
  });
  const months=[...staticMonths, ...sortMonthLabels([...liveMonthSet])];
  const tiktok={...staticTiktok, ...liveTiktok};
  const M={months, shows, tiktok};

  const presentBuckets=new Set();
  showNames.forEach(name=>[...Object.values(shows[name].data||{}),...Object.values(shows[name].pending||{})].forEach(d=>Object.keys(d||{}).forEach(k=>presentBuckets.add(k))));
  const METRICS=[['total','Total'],...([['linear','Linear TV'],['yt','YouTube'],['soc','Social'],['ac','Audio']].filter(([key])=>presentBuckets.has(key)))];
  let metric=view.graphMetric||'total';
  if(!METRICS.some(([key])=>key===metric))metric='total';
  const val=d=> !d?null:(metric==='total'?Object.values(d).reduce((sum,v)=>sum+(+v||0),0):d[metric]);
  const palette=['#E31B23','#1F3A5F','#C38318','#356B4C'];
  const colors={}; showNames.forEach((s,i)=>colors[s]=palette[i%palette.length]);
  const targets={};
  (s.media.components||[]).filter(c=>c.mode==='audience').forEach(c=>{
    const key=staticShowKey(staticM,c.name)||c.name;
    targets[key]={guarantee:n(c.audienceGuaranteed),termMonths:termMonths(p),targetByMonth:staticShows[key]&&staticShows[key].targetByMonth||null};
  });
  if(!view.graphShows) view.graphShows=['Kenty Blitz'];
  const active=showNames.filter(s=>view.graphShows.includes(s));
  const A=active.length?active:showNames;
  const viewMode=view.graphView||'monthly';
  const showPending=view.graphPending!==false;
  // Stash the exact model the chart is drawn from, so exploration and export stay WYSIWYG.
  const chartModel=view._chartModel={ months:M.months, shows:M.shows, order:A, colors, metric, metricLabel:((METRICS.find(x=>x[0]===metric)||[])[1])||'Total', partnershipName:p.name,viewMode,targets,showPending };
  const projectedDelivered=perfProjectedDeliveredMode(chartModel);
  let max=0; M.months.forEach((mo,i)=>A.forEach(show=>{
    if(projectedDelivered){
      const projected=perfTargetMonthAt(chartModel,show,i);
      const delivered=perfRawValue(chartModel,M.shows[show].data[mo]);
      if(projected!==null&&projected>max)max=projected;
      if(delivered!==null&&delivered>max)max=delivered;
      return;
    }
    const v=perfPoint(chartModel,show,i,false),pv=showPending&&perfHasPendingThrough(chartModel,show,i)?perfPoint(chartModel,show,i,true):null;
    if(v!==null&&v>max)max=v;
    if(pv!==null&&pv>max)max=pv;
  }));
  max=(viewMode==='target'&&!projectedDelivered)?Math.max(120,max*1.12||120):(max*1.14||1);
  const W=640,H=290,top=42,base=238,x0=34,plotW=W-46;
  const groupW=plotW/M.months.length, barW=Math.max(8,Math.min(34,(groupW-26)/A.length));
  let bars='';

    A.forEach((s,si)=>{
      const sh=M.shows[s];
      if(projectedDelivered){
        const projected=perfTargetMonthAt(chartModel,s,gi);

        const spread=A.length*barW+(A.length-1)*6;

      }

function monthMatches(label,month){
  if(label===month)return true;
  const a=String(label||'').trim().split(/\s+/),b=String(month||'').trim().split(/\s+/);
  return a.length===1&&b.length>1&&a[0]===b[0] || b.length===1&&a.length>1&&a[0]===b[0];
}

/* ===== Entitlement delivery (per-round schedule; monthly target = per-round × rounds that month) =====

const ENT = {
  months:['Mar','Apr','May','Jun'],       // locked NRL-round history, pre-dates the live submission flow
  rounds:{Mar:4, Apr:4, May:5, Jun:4}     // rounds per month — real schedule fact, owner-editable per month

function entitlementPanel(p){
  const s=currentSnap(p);
  const comps=(s.media.components||[]).filter(c=>(c.assets||[]).length&&c.assetReporting!=='ytd');

  const liveMonthSet=new Set();

  const months=[...ENT.months, ...sortMonthLabels([...liveMonthSet])];

  const inp=(val,ph,handler,w)=>`<input type="number" value="${val}" placeholder="${ph||''}" onchange="${handler}" style="width:${w}px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:12px">`;

    let onT=0,scored=0;
    const monthWeek=dedupedVerifiedWeeks(c).find(w=>w.label===mo);
    const rows=c.assets.map(e=>{
      const target=(+e.perWeek||0)*rounds;
      const raw=monthWeek?(monthWeek.assets||{})[e.id]:undefined;
      const has=raw!==undefined&&raw!==null&&raw!=='';
      const dv=has?(+raw||0):null;
      const pct=(has&&target>0)?Math.round(dv/target*100):null;
      if(has&&target>0){scored++; if(pct>=100)onT++;}
      const cls=pct===null?'':(pct>=100?'good':(pct>=85?'warn':'bad'));
      const status=pct===null?'<span style="color:var(--ink-faint)">—</span>':`<b style="font-family:'JetBrains Mono',monospace;color:var(--${cls})">${pct}%</b>`;

    }).join('');
    const summ=scored?`${onT}/${scored} on target`:(monthWeek?'submitted, none scoreable':'no verified submission');

    body+=`<details class="data-disclosure"><summary><span>${esc(c.name)}</span><span style="color:${summCls}">${summ}</span></summary><div class="data-disclosure-body">
      <table class="dtable"><thead><tr><th>Entitlement</th><th class="num">/round</th><th class="num">Target</th><th class="num">Delivered</th><th class="num">Fulfil</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  });
  return `<div class="panel"><div class="panel-head"><h3>Entitlement delivery</h3><div class="filters">${monthChips}</div></div><div class="panel-body">

      <span style="color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:600">NRL rounds in ${mo}</span>

  </div></div>`;
}

function currentPulse(p,s){
  const m=mediaRoll(s,p);
  const ytdAudienceTarget=audienceTargetYtd(s,p);
  const audienceDelta=pctDiff(m.del,ytdAudienceTarget);
  const audienceComps=(s.media.components||[]).filter(c=>c.mode==='audience');
  const missing=audienceComps.filter(c=>deliveryMonthsLogged(c,p)===0).map(c=>c.name);
  const pending=(s.media.components||[]).reduce((sum,c)=>sum+weeksOf(c).filter(w=>w.status!=='verified').length,0);
  const assetPace=snapshotAssetPace(p,s);
  const assetPct=assetPace.pacePct;
  const assetRows=assetPace.rows.filter(r=>r.expectedYtd!==null&&r.expectedYtd>0&&r.status!=='awaiting').length;
  const assetBehind=assetPace.behind;
  const assetAwaiting=assetPace.awaiting||[];
  const cpmBenchmark=m.delCpmBenchmark??m.propCpm;
  const cpmDelta=(m.delCpm!==null&&cpmBenchmark)?Math.round((m.delCpm-cpmBenchmark)/cpmBenchmark*100):null;
  let score=0;
  if(cpmDelta!==null) score+=cpmDelta<=0?2:(cpmDelta<=10?0:-2);
  if(audienceDelta!==null) score+=audienceDelta>=0?1:(audienceDelta>=-15?0:-2);
  if(assetPct!==null) score+=assetPct>=90?1:(assetPct>=75?0:-2);
  if(assetBehind.length) score-=Math.min(2,assetBehind.length);
  if(missing.length) score-=Math.min(2,missing.length);
  if(pending) score-=1;
  if(m.del===null) score-=2;
  const status=score>=3?'good':score>=0?'warn':'bad';
  const label={good:'On track',warn:'Watch',bad:'Off track'}[status];
  const call=status==='good'?'Maintain and optimise':status==='warn'?'Resolve current gaps':'Intervention required';
  const evidence=[];
  if(m.delCpm!==null&&cpmBenchmark!==null) evidence.push(`Delivered CPM YTD is $${m.delCpm.toFixed(2)}, ${Math.abs(cpmDelta)}% ${cpmDelta<=0?'better':'worse'} than the comparable proposed $${cpmBenchmark.toFixed(2)}.`);
  else evidence.push('There is not enough verified delivery to calculate a dependable CPM YTD.');
  if(m.del!==null&&ytdAudienceTarget!==null) evidence.push(`Views/listens YTD are ${aud(m.del)} versus a prorated YTD target of ${aud(ytdAudienceTarget)} (${audienceDelta>0?'+':''}${audienceDelta}%).`);
  if(assetPct!==null) evidence.push(`Delivery pace is ${assetPct}% through ${assetPace.asOf.label} across ${assetRows} measured asset${assetRows!==1?'s':''}; each component is equally weighted and capped at 100% so overdelivery cannot hide another shortfall.`);
  else evidence.push('No verified asset delivery is available for assessment yet.');
  if(assetBehind.length) evidence.push(`${assetBehind.length} integration component${assetBehind.length!==1?'s are':' is'} behind expected YTD pace: ${assetBehind.slice(0,3).map(r=>r.name).join(', ')}${assetBehind.length>3?' and '+(assetBehind.length-3)+' more':''}.`);
  if(assetAwaiting.length) evidence.push(`${assetAwaiting.length} integration component${assetAwaiting.length!==1?'s are':' is'} awaiting first verified delivery and ${assetAwaiting.length!==1?'are':'is'} not yet scored against pace.`);
  if(missing.length) evidence.push(`No verified views/listens have been received for ${missing.join(', ')}.`);
  if(pending) evidence.push(`${pending} monthly submission${pending!==1?'s are':' is'} awaiting verification and excluded from current results.`);
  if(p.id==='fox-footy-afl-2026'){
    const linear=(s.media.components||[]).find(c=>c.id==='fox-afl-tvcs');
    if(linear&&n(linear.baselineAudienceYtd)!==null&&n(linear.baselineAudienceTargetYtd)!==null){
      const gap=n(linear.baselineAudienceYtd)-n(linear.baselineAudienceTargetYtd);
      const pace=Math.round(n(linear.baselineAudienceYtd)/n(linear.baselineAudienceTargetYtd)*100);
      evidence.push(`Fox Footy Linear TV is ${aud(n(linear.baselineAudienceYtd))} against a ${aud(n(linear.baselineAudienceTargetYtd))} target through ${linear.baselineAsOf||'the latest report'} — ${num(gap)} ahead (${pace}%).`);
      if((linear.baselineHighlights||[]).length)evidence.push(`Foxtel rating context: ${linear.baselineHighlights.join('; ')}.`);
    }
    const production=(s.media.components||[]).find(c=>c.id==='fox-afl-production');
    if(production)evidence.push(production.fixedDelivered?'Production delivery has been confirmed and is included in the tracked scope.':'Production remains in the tracked scope but has not yet been marked delivered.');
  }
  let summary;
  if(status==='good') summary='Current delivery is efficient and the verified asset record is supporting the partnership case. Maintain the plan while looking for incremental optimisation.';
  else if(status==='warn') summary='The partnership is showing positive evidence, but the current record is incomplete. Resolve the identified reporting or delivery gaps before confirming the partnership is fully on track.';
  else summary='Current delivery evidence does not support an on-track assessment. Address efficiency, asset delivery and missing reporting before further investment decisions.';
  return {status,label,call,summary,evidence,assetPct,assetCompletionPct:assetPace.completionPct,assetBehind,assetAwaiting,pending,missing,m,asOf:assetPace.asOf};
}

/* A review must remain stable when reopened later. Pace is therefore anchored to the selected
   review-point date; only records without a review date fall back to their latest verified month. */
function periodEndDate(label,fallbackYear){
  const text=String(label||'').trim();
  const match=text.match(/^([A-Za-z]{3,9})(?:\s+(\d{4}))?$/);
  if(match){
    const mi=MONTH_NAMES.map(x=>x.toLowerCase()).indexOf(match[1].slice(0,3).toLowerCase());
    const year=+(match[2]||fallbackYear);
    if(mi>=0&&year)return new Date(year,mi+1,0,23,59,59,999);
  }
  const d=new Date(text);
  return isNaN(d)?null:d;
}
function reportingAsOf(p,s){
  const snap=s||currentSnap(p);
  const snapDate=snap&&snap.date?new Date(snap.date+'T23:59:59'):null;
  if(snapDate&&!isNaN(snapDate))return {date:snapDate,label:fmtDate(snap.date),source:'selected review point'};
  const fallbackYear=p&&p.termStart?new Date(p.termStart+'T00:00').getFullYear():new Date().getFullYear();
  let latest=null,label='';
  ((snap&&snap.media&&snap.media.components)||[]).forEach(c=>weeksOf(c).filter(w=>(w.status||'pending')==='verified').forEach(w=>{
    const d=periodEndDate(w.label,fallbackYear);
    if(d&&(!latest||d>latest)){latest=d;label=w.label;}
  }));
  if(latest)return {date:latest,label,labelSource:label,source:'latest verified reporting period'};
  const today=new Date();
  return {date:today,label:today.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}),source:'current date fallback'};
}
function termElapsedFraction(p,s){
  if(!p||!p.termStart||!p.termEnd)return null;
  const a=new Date(p.termStart+'T00:00'),b=new Date(p.termEnd+'T23:59:59'),asOf=reportingAsOf(p,s).date;
  if(isNaN(a)||isNaN(b)||b<=a)return null;
  return Math.min(1,Math.max(0,(asOf-a)/(b-a)));
}
function assetDeliveryModel(comp,p,s){
  const isYtd=comp.assetReporting==='ytd';
  const wl=verifiedWeeksLogged(comp);
  const asOf=reportingAsOf(p,s);
  const elapsed=termElapsedFraction(p,s);
  const rows=(comp.assets||[]).map(as=>{
    const fullContract=isYtd?(+as.contractedQty||0):null;
    const expectedYtd=isYtd
      ?(fullContract>0&&elapsed!==null?fullContract*elapsed:null)
      :((+as.perWeek||0)*wl||null);
    const deliveredRaw=isYtd?cumulativeAssetDelivered(comp,as,true):verifiedAssetDeliveredTotal(comp,as.id);
    const hasData=deliveredRaw!==null;
    const delivered=hasData?deliveredRaw:0;
    const paceAttainment=expectedYtd&&expectedYtd>0?delivered/expectedYtd:null;
    const contractCompletion=fullContract>0?delivered/fullContract:null;
    const gap=expectedYtd!==null?delivered-expectedYtd:null;
    const forecastFinal=isYtd&&elapsed&&elapsed>0?delivered/elapsed:null;
    let status='none';
    if(expectedYtd!==null&&expectedYtd>0){
      if(fullContract>0&&delivered>=fullContract)status='complete';
      else if((!hasData||delivered===0)&&wl<=1)status='awaiting';
      else if(!hasData||delivered<expectedYtd*.85-1e-9)status='behind';
      else status='ontrack';
    }
    return {id:as.id,name:as.name,delivered:hasData?delivered:null,fullContract,expectedYtd,paceAttainment,contractCompletion,gap,forecastFinal,status};
  });
  const measured=rows.filter(r=>r.expectedYtd!==null&&r.expectedYtd>0&&r.status!=='awaiting');
  const pacePct=measured.length?Math.round(measured.reduce((sum,r)=>sum+Math.min(r.paceAttainment||0,1),0)/measured.length*100):null;
  const contractedRows=rows.filter(r=>r.fullContract>0);
  const completionPct=contractedRows.length?Math.round(contractedRows.reduce((sum,r)=>sum+Math.min(r.contractCompletion||0,1),0)/contractedRows.length*100):null;
  return {rows,isYtd,elapsed,asOf,pacePct,completionPct,behind:rows.filter(r=>r.status==='behind').length,awaiting:rows.filter(r=>r.status==='awaiting').length,verifiedPeriods:wl};
}
function snapshotAssetPace(p,s){
  const models=((s&&s.media&&s.media.components)||[]).filter(c=>(c.assets||[]).length).map(c=>({comp:c,model:assetDeliveryModel(c,p,s)}));
  const rows=models.flatMap(x=>x.model.rows.map(r=>({...r,compId:x.comp.id,compName:x.comp.name})));
  const measured=rows.filter(r=>r.expectedYtd!==null&&r.expectedYtd>0&&r.status!=='awaiting');
  const pacePct=measured.length?Math.round(measured.reduce((sum,r)=>sum+Math.min(r.paceAttainment||0,1),0)/measured.length*100):null;
  const contracted=rows.filter(r=>r.fullContract>0);
  const completionPct=contracted.length?Math.round(contracted.reduce((sum,r)=>sum+Math.min(r.contractCompletion||0,1),0)/contracted.length*100):null;
  return {rows,pacePct,completionPct,behind:rows.filter(r=>r.status==='behind'),awaiting:rows.filter(r=>r.status==='awaiting'),asOf:reportingAsOf(p,s)};
}
/* Behind-pace assets remain visible; healthy delivery collapses. Each row opens its evidence trail. */
function deliveryMatrix(comp,p,s){
  const model=assetDeliveryModel(comp,p,s);
  const {rows,isYtd,elapsed,asOf}=model;
  if(!rows.length)return '';
  const order={behind:0,awaiting:1,none:2,complete:3,ontrack:4};
  const sorted=rows.slice().sort((x,y)=>(order[x.status]-order[y.status])||((x.paceAttainment??0)-(y.paceAttainment??0)));
  const attention=sorted.filter(r=>r.status==='behind');
  const healthy=sorted.filter(r=>r.status==='ontrack'||r.status==='complete');
  const unmeasured=sorted.filter(r=>r.status==='none'||r.status==='awaiting');
  const paceLine=isYtd&&elapsed!==null
    ? `Expected through ${asOf.label} · ${Math.round(elapsed*100)}% of term elapsed`
    : `Expected through ${asOf.label} · based on verified schedule`;
  const rowHtml=r=>{
    const ico=r.status==='behind'?'!':r.status==='complete'?'✓':r.status==='awaiting'?'◷':'○';
    const paceTxt=r.paceAttainment===null?'—':Math.round(r.paceAttainment*100)+'% pace';
    const base=Math.max(r.delivered||0,r.expectedYtd||0,r.fullContract||0)*1.08||1;
    const fillW=Math.min(100,(r.delivered||0)/base*100);
    const tickW=r.expectedYtd!==null?Math.min(100,r.expectedYtd/base*100):null;
    return `<button type="button" class="dm-row ${r.status}" onclick="openDeliveryEvidence('${comp.id}','${r.id}')" aria-label="Open delivery evidence for ${esc(r.name)}">
      <span class="dm-ico ${r.status}" aria-hidden="true">${ico}</span>
      <span class="dm-name" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="dm-track"><span class="dm-fill ${r.status}" style="width:${fillW.toFixed(1)}%"></span>${tickW!==null?`<span class="dm-pacemark" style="left:${tickW.toFixed(1)}%"></span>`:''}</span>
      <span class="dm-fig"><b>${r.delivered===null?'—':num(r.delivered)}</b>/${r.expectedYtd!==null?num(Math.round(r.expectedYtd)):'—'}<span class="pct">${paceTxt}</span></span>
    </button>`;
  };
  const bits=[];
  if(attention.length)bits.push(`<span class="sev">${attention.length} behind pace</span>`);
  if(healthy.length)bits.push(`<span class="ok">${healthy.length} on track</span>`);
  if(unmeasured.length)bits.push(`<span>${unmeasured.length} awaiting or unmeasured</span>`);
  const collapsed=[...unmeasured,...healthy];
  return `<div class="delivery-matrix">
    <div class="dm-head"><h4>Integration delivery <span class="pace-basis">Pace ${model.pacePct!==null?model.pacePct+'%':'—'}</span></h4><span class="dm-summary">${bits.join(' · ')||'—'}</span></div>
    <div class="dm-pace">${paceLine} — tick marks expected YTD</div>
    ${attention.map(rowHtml).join('')}
    ${collapsed.length?`<details class="dm-more"><summary>${collapsed.length} on track, complete or unmeasured</summary>${collapsed.map(rowHtml).join('')}</details>`:''}
  </div>`;
}
function evidenceWeekStamp(w,p,s){
  const fallbackYear=(reportingAsOf(p,s).date||new Date()).getFullYear();
  const period=periodEndDate(w&&w.label,fallbackYear);
  const submitted=w&&w.submittedAt?new Date(w.submittedAt):null;
  return period&&!isNaN(period)?period.getTime():(submitted&&!isNaN(submitted)?submitted.getTime():0);
}
function openDeliveryEvidence(compId,assetId){
  const p=STATE.partnerships.find(x=>x.id===view.pid); if(!p)return;
  const s=currentSnap(p),comp=(s.media.components||[]).find(x=>x.id===compId); if(!comp)return;
  const asset=(comp.assets||[]).find(x=>x.id===assetId); if(!asset)return;

        }
        // partner-visible fulfilment feedback: only once verified, and only entitlement counts vs contracted — never CPM/$/target audience
        let fulfil='';
        if(w.status==='verified' && (c.assets||[]).length){
          let onT=0,scored=0;
          (c.assets||[]).forEach(as=>{ const raw=(w.assets||{})[as.id]; if(raw!==undefined&&raw!==null&&raw!==''){ scored++; if((+raw||0) >= (+as.perWeek||0)) onT++; } });
          if(scored){ const pc=Math.round(onT/scored*100); fulfil=`<span class="wk-fulfil wk-fulfil-${pc>=100?'ok':pc>=70?'mid':'low'}" title="${onT} of ${scored} entitlements met their per-round target">${pc}% on target</span>`; }
        }
        const report=reportHref(w);
        const historicalCorrection=imported.some(row=>monthMatches(row.label,w.label));
        return `<div class="wk-item"><div class="wk-l"><span class="wk-status wk-${w.status||'pending'}">${w.status||'pending'}</span><span>${esc(w.label)}</span>${historicalCorrection?'<span class="wk-source">Correction</span>':''}${fulfil}</div>
        <div style="display:flex;align-items:center;gap:12px">${report?`<a class="report-link" href="${esc(report)}" target="_blank" rel="noopener">Detailed report ↗</a>`:''}${c.mode==='audience'?`<span class="wk-aud">${aud(weekAudTotal(w))}</span>`:''}<button class="linkbtn" onclick="openWeekForm('${c.id}','${w.id}','${historicalCorrection?esc(w.label):''}')">Edit</button></div></div>`;
      }).join('')+`</div>`;
    } else html+=`<div class="wk-empty">No delivery received yet${nextMonth?` — ${esc(nextMonth)} reporting is due`:''}.</div>`;
    html+= nextMonth?`<button class="btn btn-primary" onclick="openWeekForm('${c.id}')">＋ Log ${esc(nextMonth)}</button>`:`<div class="wk-hint" style="margin:8px 0 0">Every reporting month is already recorded. Use Edit on a submitted month to send a correction.</div>`;
    html+=`</div></div>`;
  });
  document.getElementById('app').innerHTML=html;
}

function ensurePartnerSubmissionSchema(c){
  const schema=FANATICS_SUBMISSION_SCHEMA[(c&&c.name)||''];
  if(!c||!schema)return c;
  c.platforms=[...schema.platforms];
  if(c.name==='Kenty Blitz')c.assets=(c.assets||[]).filter(a=>a.id!=='kb_sm'&&!/statmate\s*mention/i.test(a.name||''));
  if(!Array.isArray(c.assets)||(!c.assets.length&&schema.assets.length))c.assets=schema.assets.map(a=>({...a}));
  if(['Kenty Blitz','Kenty Primetime','Rugby League Insider (RLI)'].includes(c.name)){
    weeksOf(c).forEach(w=>{
      const old=w.audience||{};
      if(old.Audio===undefined){
        const audio=Object.entries(old).filter(([k])=>/audio|acast|spotify|apple/i.test(k)).reduce((sum,[,v])=>sum+(+v||0),0);
        if(audio)old.Audio=audio;
      }
      if(old.Social===undefined){
        const social=Object.entries(old).filter(([k])=>/social|facebook|instagram|tiktok/i.test(k)).reduce((sum,[,v])=>sum+(+v||0),0);
        if(social)old.Social=social;
      }
    });
  }
  if(schema.assetReporting&&!c.assetReporting)c.assetReporting=schema.assetReporting;
  if(!c.assetReporting&&(c.assets||[]).some(a=>a.contractedQty!==undefined))c.assetReporting='ytd';
  if(!c.mode)c.mode='audience';
  return c;
}

function slug(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }
async function saveWeek(cid,wid){
  const s=latestSnap(STATE.partnerships.find(x=>x.id===view.partnerPid));
  const c=ensurePartnerSubmissionSchema(s.media.components.find(x=>x.id===cid));
  const w=wid?(c.weeks||[]).find(x=>x.id===wid):null;
  const monthEl=document.getElementById('w_label');
  const label=monthEl?(monthEl.value||'').trim():''; if(!label){toast('Select a month');return;}
  const comments=(document.getElementById('w_comments').value||'').trim();
  const note=comments;
  const audience={}; let audienceEntries=0;
  (c.platforms||[]).forEach(pl=>{ const v=document.getElementById('wa_'+slug(pl)); if(v&&v.value!==''){audience[pl]=+v.value;audienceEntries++;} });
  const assetsObj={};
  let assetEntries=0;
  const importedCorrection=!!document.getElementById('w_imported');
  if((c.assets||[]).length){
    c.assets.forEach(as=>{
      const v=document.getElementById('wk_'+as.id); if(v&&v.value!==''){assetsObj[as.id]=+v.value;assetEntries++;}
      const existingClip=w&&w.assets?w.assets[as.id+'__clip']:null;
      if(existingClip) assetsObj[as.id+'__clip']=existingClip;
    });
  } else if(c.mode==='fulfilment'){ const v=document.getElementById('wk_qty'); if(v&&v.value!==''){assetsObj.qty=+v.value;assetEntries++;} }
  if(c.mode==='audience'&&(c.platforms||[]).length&&!audienceEntries){toast('Enter at least one audience figure for this month');return;}
  if((c.assets||[]).length&&!assetEntries&&!importedCorrection){toast(c.assetReporting==='ytd'?'Enter the current integration totals YTD':'Enter at least one asset delivery figure for this month');return;}

  const previousReport=w&&w.assets?w.assets.__report:null;
  const previousReportName=w&&w.assets?w.assets.__report_name:null;
  if(previousReport)assetsObj.__report=previousReport;
  if(previousReportName)assetsObj.__report_name=previousReportName;
  const reportInput=document.getElementById('w_report');
  const reportFile=reportInput&&reportInput.files&&reportInput.files[0];
  if(reportFile){
    if(reportFile.size>25*1024*1024){toast('Detailed report must be 25 MB or smaller');return;}
    if(!SB){toast('Detailed reports require the live version of the portal');return;}
    else{
      const btn=document.querySelector('.modal-foot .btn-primary'); if(btn){btn.disabled=true; btn.textContent='Uploading…';}
      try{
        const path=`${c.partnership_id||view.partnerPid}/${cid}/${slug(label)}/report-${Date.now()}-${slug(reportFile.name)}`;
        const {error:upErr}=await SB.storage.from('pr-clips').upload(path,reportFile,{upsert:true});
        if(upErr)throw upErr;
        assetsObj.__report='storage:'+path;
        assetsObj.__report_name=reportFile.name;
      }catch(e){toast('Detailed report upload failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Submit';}return;}
    }
  }

  if(SB){
    try{
      const dupe=!wid?(c.weeks||[]).find(x=>x.label===label):null; // safety net — should already be prevented by the dropdown filter
      const targetWid=wid||(dupe?dupe.id:null);
      const wasVerified=(w&&w.status==='verified')||(dupe&&dupe.status==='verified');
      if(targetWid) await sbUpdateWeek(targetWid,{label,audience,assets:assetsObj,note});
      else await sbInsertWeek({partnership_id:c.partnership_id||view.partnerPid,component_id:cid,label,audience,assets:assetsObj,note});
      await refreshPartner(); closeModal();
      toast(wasVerified?'Month updated — sent back for PointsBet to re-verify':(targetWid?'Month updated':'Month submitted'));
    }catch(e){ toast('Error: '+e.message); }
    return;
  }
  c.weeks=c.weeks||[];
  if(wid){ const wk=c.weeks.find(x=>x.id===wid); Object.assign(wk,{label,note,audience,assets:assetsObj,status:'pending'}); }
  else c.weeks.push({id:uid(),label,note,audience,assets:assetsObj,status:'pending',submittedAt:new Date().toISOString().slice(0,10)});
  if(c.mode==='fulfilment') c.deliveredQty=c.weeks.reduce((a,w)=>a+(+((w.assets||{}).qty)||0),0);
  await persist(); closeModal(); render(); toast(wid?'Month updated':'Month submitted');
}
async function deleteWeek(cid,wid){
  const s=latestSnap(STATE.partnerships.find(x=>x.id===view.partnerPid));

async function loadPartnerData(){
  const assignedEmail=(view.email||'').trim().toLowerCase();

    SB.from('pr_partner_show').select('*').eq('partner_email',assignedEmail),
    SB.from('pr_week').select('*').eq('partner_email',assignedEmail)
  ]);
  if(showsRes.error)throw showsRes.error;
  if(weeksRes.error)throw weeksRes.error;
  const shows=showsRes.data||[], weeks=weeksRes.data||[];
  const byPid={}; shows.forEach(s=>{ (byPid[s.partnership_id]=byPid[s.partnership_id]||[]).push(s); });

        weeks: weeks.filter(w=>w.partnership_id===s.partnership_id&&w.component_id===s.component_id).map(weekRowToObj) })) },

/* ============================================================ DECISION MODULES ============================================================ */
function setModule(id){ view.module=id; render(); }
function moduleHero(kicker,title,copy,actions=''){
  return `<section class="module-hero"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${copy}</p>${actions?`<div style="margin-top:14px">${actions}</div>`:''}</section>`;
}
function metricCard(label,value,compare='',tone=''){
  return `<div class="metric-card"><div class="label">${label}</div><div class="value ${tone}">${value}</div>${compare?`<div class="compare">${compare}</div>`:''}</div>`;
}
function metricValue(p,s,key){
  const m=mediaRoll(s,p), c=s.commercial||{};
  if(key==='media_value') return (+p.contractedValue||0)||(m.inv||null);
  if(key==='reach') return m.del!==null?m.del:m.guar;
  if(key==='cpm') return m.delCpm!==null?m.delCpm:m.propCpm;
  if(key==='ngr') return n(c.ngrAct);
  if(key==='actives') return n(c.activesAct);
  if(key==='delivery'){
    return snapshotAssetPace(p,s).pacePct;
  }
  return null;
}
function metricFormat(key,v){ if(v===null||v===undefined)return '—'; if(key==='media_value'||key==='ngr')return money(v); if(key==='reach')return aud(v); if(key==='cpm')return '$'+v.toFixed(2); if(key==='delivery')return Math.round(v)+'%'; return num(v); }
function metricDirection(key){return key==='cpm'?'lower':'higher';}
function previousSnapshot(p,s){ const i=p.snapshots.findIndex(x=>x.id===s.id); return i>0?p.snapshots[i-1]:null; }
function benchmarkBase(p,s,key){
  if(view.benchmarkBasis==='previous'){ const prev=previousSnapshot(p,s); return {label:'Previous review',value:prev?metricValue(p,prev,key):null,sample:prev?1:0}; }
  if(view.benchmarkBasis==='target'){
    const c=s.commercial||{}; const m=mediaRoll(s);
    const maps={ngr:n(c.ngrExp),actives:n(c.activesExp),reach:m.guar,cpm:m.delCpmBenchmark??m.propCpm,delivery:100,media_value:n(p.contractedValue)};
    return {label:'Plan / target',value:maps[key]??null,sample:1};
  }
  const vals=STATE.partnerships.map(x=>metricValue(x,currentSnap(x),key)).filter(v=>v!==null);
  return {label:'Portfolio average',value:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,sample:vals.length};
}
function deltaInfo(key,current,base){
  if(current===null||base===null||base===0)return {text:'—',cls:'',pct:null};
  const pct=(current-base)/Math.abs(base)*100, favourable=metricDirection(key)==='lower'?pct<=0:pct>=0;
  return {text:`${pct>0?'+':''}${Math.round(pct)}%`,cls:favourable?'good':'bad',pct};
}
function setBenchmarkBasis(value){view.benchmarkBasis=value;render();}
function renderEfficiency(p,s){
  const m=mediaRoll(s,p);
  const isFoxTracked=p.id==='fox-footy-afl-2026';
  const comps=(s.media.components||[]).filter(c=>isFoxTracked||c.mode==='audience');
  const efficiencyCopy=isFoxTracked
    ?`Efficiency for the active ${money(m.inv)} Linear TVCs, Fox Footy Integrations and Production scope. The full ${money(p.contractedValue)} partnership remains visible but streaming, standalone social and digital do not affect these calculations.`
    :'How the money spent on this partnership converts into audience, per show and blended. Investment is set per show and is the single source of truth for every CPM.';
  let html=moduleHero('Media efficiency',isFoxTracked?'Tracked media efficiency':'Media efficiency',efficiencyCopy,`<button class="btn btn-primary" onclick="editComponent(null)">＋ Show / package</button>`);
  html+=`<div class="metric-strip">${metricCard(isFoxTracked?'Tracked investment':'Total investment',money(m.inv),isFoxTracked?`${money(p.contractedValue)} full partnership value`:'Sum of per-show costs')}${metricCard('Investment YTD',m.spendToDate!==null?money(m.spendToDate):'—','Prorated to verified delivery period')}${metricCard('Views/listens YTD',metricFormat('reach',m.del!==null?m.del:m.guar),m.del!==null?'From monthly performance':'Guaranteed')}${metricCard('Blended delivered CPM YTD',m.delCpm!==null?'$'+m.delCpm.toFixed(2):'—',m.periodMatched?'Investment YTD ÷ views/listens YTD':'Across all shows')}${metricCard('Proposed CPM',m.propCpm!==null?'$'+m.propCpm.toFixed(2):'—','At guaranteed delivery')}</div>`;
  // per-show CPM table
  html+=`<section class="panel"><div class="panel-head"><h3>${isFoxTracked?'Investment and CPM by tracked area':'CPM by show'}</h3><span class="lil">Investment YTD ÷ views/listens YTD</span></div><div class="panel-body"><table class="dtable"><thead><tr><th>${isFoxTracked?'Tracked area':'Show'}</th><th class="num">Total investment</th><th class="num">Investment YTD</th><th class="num">Views/listens YTD</th><th class="num">Delivered CPM YTD</th><th class="num">Proposed CPM</th></tr></thead><tbody>`;
  if(comps.length){
    const totalMonths=termMonths(p);
    comps.forEach(c=>{
      const inv=n(c.investment),g=n(c.audienceGuaranteed),d=audDelivered(c,p),wl=deliveryMonthsLogged(c,p);
      const pc=cpm(inv,g);
      const invYtd=(totalMonths&&wl>0&&inv!==null)?inv/totalMonths*Math.min(wl,totalMonths):null;
      let dc=cpm(invYtd,d); if(dc===null) dc=cpm(inv,d);
      const dcCls=(dc!==null&&pc!==null)?(dc<=pc?'good':'bad'):'';
      html+=`<tr><td><b>${esc(c.name)}</b></td><td class="num">${inv!==null?money(inv):'—'}</td><td class="num">${invYtd!==null?money(invYtd):'—'}</td><td class="num">${d!==null?aud(d):(g!==null?aud(g)+' guar':'—')}</td><td class="num"><b style="color:var(--${dcCls||'ink'})">${dc!==null?'$'+dc.toFixed(2):'—'}</b></td><td class="num">${pc!==null?'$'+pc.toFixed(2):'—'}</td></tr>`;
    });
    html+=`<tr style="border-top:2px solid var(--line)"><td><b>${isFoxTracked?'Reported scope (comparable)':'Partnership (blended)'}</b></td><td class="num"><b>${money(isFoxTracked?(m.reportedInv??m.inv):m.inv)}</b></td><td class="num"><b>${m.spendToDate!==null?money(m.spendToDate):'—'}</b></td><td class="num"><b>${m.del!==null?aud(m.del):(m.guar!==null?aud(m.guar)+' guar':'—')}</b></td><td class="num"><b>${m.delCpm!==null?'$'+m.delCpm.toFixed(2):'—'}</b></td><td class="num"><b>${(m.delCpmBenchmark??m.propCpm)!==null?'$'+(m.delCpmBenchmark??m.propCpm).toFixed(2):'—'}</b></td></tr>`;
  } else {
    html+=`<tr><td colspan="6" style="color:var(--ink-faint)">No audience shows on this partnership yet.</td></tr>`;
  }
  html+=`</tbody></table><div class="data-note">Delivered CPM YTD prorates each show's investment across the contract term and divides investment YTD by verified views/listens YTD. The monthly graph, show totals and partnership roll-up use the same performance records.</div></div></section>`;
  return html;
}
function executiveFacts(s){
  const a=s.assessment||blankAssess();
  const clean=items=>(items||[]).map(x=>(x||'').trim()).filter(Boolean);
  const highlights=[...clean(a.winning),...clean(a.deliverables)];
  const risks=clean(a.falling);
  const opps=clean(a.evolution);
  return {
    highlights:highlights.length?highlights.slice(0,6):['No verified achievements have been recorded for this review point.'],
    risks:risks.length?risks.slice(0,5):['No material risks have been recorded for this review point.'],
    opps:opps.length?opps.slice(0,5):['No next-step opportunities have been recorded for this review point.']
  };
}
function renderExecutive(p,s){
  const f=executiveFacts(s),action=s.call||'not set',label={'renew':'Renew','evolve':'Renew with revised terms','renegotiate':'Renew with revised terms','exit':'Exit','not set':'Not set'}[action]||'Not set';
  const pulse=currentPulse(p,s);
  const status={good:'Performing above expectations',warn:'Mixed performance',bad:'Requires review'}[pulse.status]||'Insufficient data';
  const m=mediaRoll(s,p);
  const metrics=[
    [p.id==='fox-footy-afl-2026'?'Tracked investment':'Investment',money(m.inv)],
    ['Reach',metricFormat('reach',metricValue(p,s,'reach'))],
    ['Delivered CPM',m.delCpm!==null?'$'+m.delCpm.toFixed(2):'—'],
    ['Delivery pace',metricFormat('delivery',metricValue(p,s,'delivery'))]
  ];
  // benchmark row (folded in from the old Benchmarking module) — CPM & reach vs portfolio / previous / target
  const benchKeys=['reach','cpm','delivery'];
  const benchLabels={reach:'Reach',cpm:'Delivered CPM',delivery:'Delivery pace'};
  const basis=benchKeys.map(k=>benchmarkBase(p,s,k)); const first=basis[0];
  const draftChange=m.del!==null&&m.guar!==null?`Audience delivery is ${Math.round((m.del-m.guar)/m.guar*100)}% against the guarantee`:'Audience delivery is not yet complete enough to compare with the guarantee';
  const draftBenchmark=m.delCpmBenchmark??m.propCpm;
  const draftCpm=m.delCpm!==null?`, at a delivered CPM of $${m.delCpm.toFixed(2)}${draftBenchmark!==null?` versus $${draftBenchmark.toFixed(2)} comparable proposed`:''}`:'';
  let html=moduleHero('Board-ready view','Executive summary','A concise, printable decision surface — named evidence, a recommended action, and how this partnership compares. Never an overall partnership score.',`<button class="btn btn-ghost" onclick="window.print()">Print / save PDF</button>`);
  html+=`<div class="metric-strip">${metrics.map(x=>metricCard(x[0],x[1],x[0]==='Delivered CPM'&&m.periodMatched?'Spend to date vs audience to date':`As at ${fmtDate(s.date)}`)).join('')}</div>`;
  // draft summary (absorbed from AI insights)
  html+=`<section class="panel"><div class="panel-head"><h3>Draft summary</h3><span class="lil">Edit before sharing</span></div><div class="panel-body"><div class="insight">${esc(p.name)} is currently marked ${pulse.status==='good'?'on track':pulse.status==='warn'?'for review':'with insufficient or mixed evidence'}. Delivery pace is ${pulse.assetPct!==null?pulse.assetPct+'% through '+esc(pulse.asOf.label):'not yet measurable'}. ${draftChange}${draftCpm}. The current recommended action is ${s.call?esc(s.call):'not set'}.</div><div class="data-note">Built only from this review point's verified delivery data, assessment and verdict — nothing is inferred or sent anywhere.</div></div></section>`;
  html+=`<div class="summary-grid"><div><section class="panel"><div class="panel-head"><h3>Decision brief</h3><span class="lil">${status}</span></div><div class="panel-body"><h4 style="margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--good)">Key achievements</h4><ul class="summary-list">${f.highlights.map(x=>`<li>✓ ${esc(x)}<span class="evidence">Source: assessment or verified delivery</span></li>`).join('')}</ul><h4 style="margin:18px 0 8px;font-size:12px;text-transform:uppercase;color:var(--bad)">Risks</h4><ul class="summary-list">${f.risks.map(x=>`<li>⚠ ${esc(x)}<span class="evidence">Owner: partnership lead</span></li>`).join('')}</ul><h4 style="margin:18px 0 8px;font-size:12px;text-transform:uppercase;color:var(--accent)">Opportunities</h4><ul class="summary-list">${f.opps.map(x=>`<li>• ${esc(x)}</li>`).join('')}</ul></div></section>
    <section class="panel" style="margin-top:18px"><div class="panel-head"><h3>How it compares</h3><div class="filters"><select class="sel" style="width:auto" onchange="setBenchmarkBasis(this.value)"><option value="portfolio" ${view.benchmarkBasis==='portfolio'?'selected':''}>Portfolio average</option><option value="previous" ${view.benchmarkBasis==='previous'?'selected':''}>Previous review</option><option value="target" ${view.benchmarkBasis==='target'?'selected':''}>Plan / target</option></select></div></div><div class="panel-body"><table class="dtable"><thead><tr><th>Metric</th><th class="num">Current</th><th class="num">${esc(first.label)}</th><th class="num">Variance</th></tr></thead><tbody>${benchKeys.map((k,i)=>{const cur=metricValue(p,s,k),b=basis[i],d=deltaInfo(k,cur,b.value);return `<tr><td><b>${benchLabels[k]}</b></td><td class="num">${metricFormat(k,cur)}</td><td class="num">${metricFormat(k,b.value)}</td><td class="num"><span class="delta ${d.cls}">${d.text}</span></td></tr>`;}).join('')}</tbody></table><div class="data-note">Metric-level comparison only — no composite rank. ${first.sample?`${first.sample} comparable record${first.sample===1?'':'s'}.`:'No comparable records yet.'}</div></div></section></div>
    <aside><div class="decision-card"><div style="font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.06em">Recommended action</div><div class="decision">${label}</div><div style="font-size:12.5px;color:var(--ink-soft)">${s.verdict?esc(s.verdict):'Add a verdict to document the decision rationale.'}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${CALLS.map(x=>`<button class="chip ${s.call===x?'on':''}" onclick="setCall('${x}')">${x==='renegotiate'?'Revised terms':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><section class="panel" style="margin-top:18px"><div class="panel-head"><h3>Timeline</h3></div><div class="panel-body"><div class="timeline"><div>Next review<small>${fmtDate(s.date)} · partnership owner</small></div><div>Contract expiry<small>${fmtDate(p.termEnd) || 'Not recorded'}</small></div></div></div></section></aside></div>`;
  return html;
}

async function setStatus(v){ const s=curSnap(); s.status=(s.status===v?'':v); await persist(); render(); }
async function setCall(v){ const s=curSnap(); s.call=(s.call===v?'':v); await persist(); render(); }
async function saveVerdict(){ const s=curSnap(); s.verdict=document.getElementById('verdictText').value.trim(); await persist(); render(); toast('Verdict saved'); }

function mount(h){ document.getElementById('modalMount').innerHTML=h; }
function closeModal(){ document.getElementById('modalMount').innerHTML=''; }
function scrim(inner,wide){ return `<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}">${inner}</div></div>`; }

function editPartnership(pid){
  const p=pid?STATE.partnerships.find(x=>x.id===pid):null;
  mount(scrim(`<div class="modal-head"><h3>${p?'Edit partnership':'New partnership'}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Name</label><input class="inp" id="p_name" value="${p?esc(p.name):''}" placeholder="e.g. FanaticsTV"></div>
      <div class="field"><label>Counterparty</label><input class="inp" id="p_cp" value="${p?esc(p.counterparty):''}"></div>
      <div class="frow"><div class="field"><label>Category</label><select class="sel" id="p_cat">${CATEGORIES.map(c=>`<option ${p&&p.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Headline value (AUD)</label><input class="inp" id="p_val" type="number" value="${p?p.contractedValue:''}"><div class="hint">Optional — the media total drives the per-review figure.</div></div></div>
      <div class="frow"><div class="field"><label>Term start</label><input class="inp" id="p_ts" type="date" value="${p?p.termStart:''}"></div>
        <div class="field"><label>Term end</label><input class="inp" id="p_te" type="date" value="${p?p.termEnd:''}"></div></div>
    </div>
    <div class="modal-foot"><div>${p&&!p.example?`<button class="btn btn-danger" onclick="deletePartnership('${p.id}')">Delete</button>`:''}</div>
      <div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePartnership('${pid||''}')">${p?'Save':'Create'}</button></div></div>`));
}
async function savePartnership(pid){
  const name=document.getElementById('p_name').value.trim(); if(!name){toast('Give it a name');return;}
  const data={name,counterparty:document.getElementById('p_cp').value.trim(),category:document.getElementById('p_cat').value,contractedValue:+document.getElementById('p_val').value||0,termStart:document.getElementById('p_ts').value,termEnd:document.getElementById('p_te').value};
  if(pid) Object.assign(STATE.partnerships.find(x=>x.id===pid),data);
  else { const np={id:uid(),...data,snapshots:[blankSnap('Initial review')]}; STATE.partnerships.push(np); view.screen='detail'; view.pid=np.id; view.sid=null; }
  await persist(); closeModal(); render(); toast('Saved');
}
async function deletePartnership(pid){
  if(!confirm('Delete this partnership and all its review points? This also permanently removes any partner-submitted monthly data and partner access for this partnership — this cannot be undone.'))return;
  if(SB){
    try{
      await SB.from('pr_week').delete().eq('partnership_id',pid);
      await SB.from('pr_partner_show').delete().eq('partnership_id',pid);
    }catch(e){ toast('Warning: could not fully clean up related data — '+e.message); }
  }
  STATE.partnerships=STATE.partnerships.filter(x=>x.id!==pid);
  await persist(); closeModal(); go('board'); toast('Deleted');
}

function addSnapshot(){
  mount(scrim(`<div class="modal-head"><h3>New review point</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--ink-soft);margin-top:0">A dated snapshot — e.g. mid-season, end-of-season — so you can see how the partnership tracked at a given moment.</p>
      <div class="frow"><div class="field"><label>Label</label><input class="inp" id="s_label" placeholder="e.g. Mid Season 2026"></div>
        <div class="field"><label>Date</label><input class="inp" id="s_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
      <div class="field"><label><input type="checkbox" id="s_carry" checked style="width:auto;margin-right:6px">Carry over shows & assessment from the latest review</label></div>
    </div>
    <div class="modal-foot"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveSnapshot()">Create</button></div></div>`));
}
async function saveSnapshot(){
  const p=STATE.partnerships.find(x=>x.id===view.pid);
  const ns=blankSnap(document.getElementById('s_label').value.trim()||'Review'); ns.date=document.getElementById('s_date').value||ns.date;
  if(document.getElementById('s_carry').checked){ const prev=latestSnap(p);
    ns.media.components=(prev.media.components||[]).map(c=>({...c,id:uid(),audienceDelivered:'',deliveredQty:'',fixedDelivered:false}));
    ns.commercial.ngrExp=prev.commercial.ngrExp; ns.commercial.activesExp=prev.commercial.activesExp; ns.commercial.turnoverExp=prev.commercial.turnoverExp;
    ns.assessment={deliverables:[...prev.assessment.deliverables],winning:[...prev.assessment.winning],falling:[...prev.assessment.falling],evolution:[...prev.assessment.evolution],levers:JSON.parse(JSON.stringify(prev.assessment.levers))};
  }
  p.snapshots.push(ns); view.sid=ns.id; await persist(); closeModal(); render(); toast('Review point added');
}
async function deleteSnapshot(){ const p=STATE.partnerships.find(x=>x.id===view.pid); if(p.snapshots.length<=1){toast('Keep at least one review point');return;} if(!confirm('Delete this review point?'))return; const s=currentSnap(p); p.snapshots=p.snapshots.filter(x=>x.id!==s.id); view.sid=null; await persist(); render(); toast('Deleted'); }

function editValueAdd(){
  const s=curSnap();
  mount(scrim(`<div class="modal-head"><h3>Value-add</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><div class="field"><label>Value-add delivered (AUD)</label><input class="inp" id="va" type="number" value="${s.media.valueAdd}" placeholder="e.g. 1781563"><div class="hint">Bonus / working-media uplift delivered above the contracted buy. Audience over-delivery shows automatically from the shows.</div></div></div>
    <div class="modal-foot"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveValueAdd()">Save</button></div></div>`));
}
async function saveValueAdd(){ curSnap().media.valueAdd=document.getElementById('va').value; await persist(); closeModal(); render(); toast('Saved'); }

function editComponent(cid){
  const s=curSnap(); const comps=s.media.components||(s.media.components=[]);
  const c=cid?comps.find(x=>x.id===cid):{mode:'audience',name:'',investment:'',audienceGuaranteed:'',audienceDelivered:'',fixedDelivered:false,contractedQty:'',deliveredQty:'',unit:'',entitlements:[]};
  mount(scrim(`<div class="modal-head"><h3>${cid?'Edit show / package':'Add show / package'}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Name</label><input class="inp" id="k_name" value="${esc(c.name)}" placeholder="e.g. Rugby League Insider (RLI)"></div>
      <div class="frow"><div class="field"><label>Investment for this show (AUD)</label><input class="inp" id="k_inv" type="number" value="${c.investment}" placeholder="e.g. 250000"><div class="hint" style="margin-top:5px">The single source of truth for this show's cost — every CPM is calculated from it. No separate ledger.</div></div>
        <div class="field"><label>How is value measured?</label><select class="sel" id="k_mode" onchange="compModeFields(this.value)">
          <option value="audience" ${c.mode==='audience'?'selected':''}>Audience — guaranteed vs delivered, CPM</option>
          <option value="fulfilment" ${c.mode==='fulfilment'?'selected':''}>Fulfilment — delivered vs contracted qty</option>
          <option value="fixed" ${c.mode==='fixed'?'selected':''}>Fixed — set value, delivered or not</option>
        </select></div></div>
      <div id="k_modeExtra"></div>
      <div class="field"><label>Entitlements (one per line)</label><textarea class="inp" id="k_ent" rows="3" placeholder="Odds overlay&#10;Nic's Tips&#10;TVC x2/wk">${(c.entitlements||[]).join('\n')}</textarea></div>
    </div>
    <div class="modal-foot"><div>${cid?`<button class="btn btn-danger" onclick="delComponent('${cid}')">Delete</button>`:''}</div>
      <div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveComponent('${cid||''}')">Save</button></div></div>`,true));
  compModeFields(c.mode,c);
}
function compModeFields(mode,c){
  c=c||{}; const box=document.getElementById('k_modeExtra'); if(!box)return;
  if(mode==='audience'){
    const p=STATE.partnerships.find(x=>x.id===view.pid);
    const delivered=audDelivered(c,p), months=deliveryMonthsLogged(c,p);
    box.innerHTML=`<div class="frow"><div class="field"><label>Views/listens guaranteed</label><input class="inp" id="k_ag" type="number" value="${c.audienceGuaranteed||''}" placeholder="e.g. 11025000"></div><div class="field"><label>Views/listens delivered YTD</label><input class="inp" type="text" value="${delivered!==null?num(delivered):''}" placeholder="No verified monthly data yet" readonly style="background:var(--canvas);cursor:default"></div></div><div class="hint" style="margin-top:-6px;margin-bottom:6px">Calculated from ${months||'verified'} monthly performance record${months===1?'':'s'}. Delivered CPM YTD = investment YTD ÷ (views/listens YTD ÷ 1,000).</div>`;
  }
  else if(mode==='fulfilment') box.innerHTML=`<div class="frow3"><div class="field"><label>Contracted</label><input class="inp" id="k_cq" type="number" value="${c.contractedQty||''}"></div><div class="field"><label>Delivered</label><input class="inp" id="k_dq" type="number" value="${c.deliveredQty||''}"></div><div class="field"><label>Unit</label><input class="inp" id="k_unit" value="${esc(c.unit||'')}" placeholder="streams"></div></div>`;
  else box.innerHTML=`<div class="field"><label><input type="checkbox" id="k_fx" ${c.fixedDelivered?'checked':''} style="width:auto;margin-right:7px">Delivered — count the full investment as value</label></div>`;
}
async function saveComponent(cid){
  const s=curSnap(); const mode=document.getElementById('k_mode').value;
  const comps=s.media.components;
  const existing=cid?comps.find(x=>x.id===cid)||{}:{};
  const c={...existing,id:cid||uid(),name:document.getElementById('k_name').value.trim(),investment:document.getElementById('k_inv').value,mode,
    entitlements:document.getElementById('k_ent').value.split('\n').map(x=>x.trim()).filter(Boolean),
    audienceGuaranteed:'',audienceDelivered:existing.audienceDelivered||'',fixedDelivered:false,contractedQty:'',deliveredQty:'',unit:'',
    platforms:existing.platforms||[],assets:existing.assets||[],weeks:existing.weeks||[]};
  if(mode==='audience'){ c.audienceGuaranteed=document.getElementById('k_ag').value; }
  else if(mode==='fulfilment'){ c.contractedQty=document.getElementById('k_cq').value; c.deliveredQty=document.getElementById('k_dq').value; c.unit=document.getElementById('k_unit').value.trim(); }
  else c.fixedDelivered=document.getElementById('k_fx').checked;
  if(!c.name){toast('Name the show / package');return;}
  if(cid){const i=comps.findIndex(x=>x.id===cid);comps[i]=c;} else comps.push(c);
  await persist(); closeModal(); render(); toast('Saved');
}
async function delComponent(cid){ const s=curSnap(); s.media.components=s.media.components.filter(x=>x.id!==cid); await persist(); closeModal(); render(); }

function editAssessment(){
  const a=curSnap().assessment;
  const ta=(id,items)=>`<textarea class="inp" id="${id}" rows="4" placeholder="One point per line">${items.join('\n')}</textarea>`;
  const lv=(key,label)=>{ const d=a.levers[key]||{}; return `<div style="border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><label style="margin:0">${label}</label>
      <select class="sel" id="lv_${key}_r" style="width:auto"><option value="">Not assessed</option><option value="good" ${d.rating==='good'?'selected':''}>✓ Good</option><option value="watch" ${d.rating==='watch'?'selected':''}>~ Watch</option><option value="concern" ${d.rating==='concern'?'selected':''}>✗ Concern</option></select></div>
    <textarea class="inp" id="lv_${key}_n" rows="2" placeholder="Short note">${esc(d.note||'')}</textarea></div>`; };
  mount(scrim(`<div class="modal-head"><h3>Assessment</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <label style="font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600">Review narrative</label>
      <div class="frow" style="margin-top:8px"><div class="field"><label>Topline deliverables</label>${ta('a_deliv',a.deliverables)}</div><div class="field"><label>Where we're winning</label>${ta('a_win',a.winning)}</div></div>
      <div class="frow"><div class="field"><label>Where we're falling down</label>${ta('a_fall',a.falling)}</div><div class="field"><label>Next evolution</label>${ta('a_evo',a.evolution)}</div></div>
      <label style="font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600">Strategic levers</label>
      <div style="margin-top:8px">${LEVERS.map(([k,l])=>lv(k,l)).join('')}</div>
    </div>
    <div class="modal-foot"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAssessment()">Save</button></div></div>`,true));
}
async function saveAssessment(){
  const a=curSnap().assessment;
  const lines=id=>document.getElementById(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  a.deliverables=lines('a_deliv'); a.winning=lines('a_win'); a.falling=lines('a_fall'); a.evolution=lines('a_evo');
  LEVERS.forEach(([k])=>{ a.levers[k]={rating:document.getElementById('lv_'+k+'_r').value,note:document.getElementById('lv_'+k+'_n').value.trim()}; });
  await persist(); closeModal(); render(); toast('Assessment saved');
}

function dataMenu(){
  mount(scrim(`<div class="modal-head"><h3>Data</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--ink-soft);margin-top:0">Data is stored in this browser. For the shared team build, swap the storage adapter for Supabase (note at the top of the file).</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ghost" onclick="exportData()">⬇ Export JSON</button>
        <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆ Import JSON</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)"></div>
      <div style="margin-top:18px;border-top:1px solid var(--line-soft);padding-top:14px"><button class="btn btn-danger" onclick="resetData()">Reset to seed data</button></div></div>
    <div class="modal-foot"><div></div><button class="btn btn-primary" onclick="closeModal()">Done</button></div>`));
}
function exportData(){ const b=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='partnership-review-backup.json'; a.click(); URL.revokeObjectURL(u); toast('Exported'); }
function importData(input){
  const f=input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    let parsed,weekRows=[];
    try{
      parsed=JSON.parse(r.result);
      (parsed.partnerships||[]).forEach(p=>(p.snapshots||[]).forEach(sn=>((sn.media&&sn.media.components)||[]).forEach(c=>{
        (c.weeks||[]).forEach(w=>{
          weekRows.push({ id:w.id, partnership_id:p.id, component_id:c.id, partner_email:w.partnerEmail||'',
            label:w.label, audience:w.audience||{}, assets:w.assets||{}, note:w.note||'',
            verified:w.status==='verified', submitted_at:w.submittedAt||new Date().toISOString().slice(0,10) });
        });
      })));
    }catch(e){ toast('Could not read that file'); return; }
    try{
      STATE=parsed;
      await persist();  // if this throws, persist() has already shown the accurate save/conflict toast
      if(SB && weekRows.length){
        try{ const {error}=await SB.from('pr_week').upsert(weekRows); if(error)throw error; await ownerRefreshWeeks(); }
        catch(e){ closeModal(); go('board'); render(); toast('Imported the review data, but monthly submissions failed to restore: '+e.message); return; }
      }
      closeModal(); go('board');
      toast(weekRows.length?`Imported — restored ${weekRows.length} monthly submission${weekRows.length!==1?'s':''}`:'Imported');
    }catch(e){ if(!(e&&(e.isConflict||/save/i.test(e.message||'')))) toast('Import failed: '+((e&&e.message)||'unknown error')); }
  };
  r.readAsText(f);
}
async function resetData(){ if(!confirm('Reset to seeded data? Current entries will be lost.'))return; STATE=seed(); await persist(); closeModal(); go('board'); toast('Reset'); }

document.getElementById('btnData').onclick=dataMenu;
Object.assign(window,{editPartnership,go,openDetail,setFilter,pickSnap,setStatus,setCall,saveVerdict,savePartnership,deletePartnership,addSnapshot,saveSnapshot,deleteSnapshot,editValueAdd,saveValueAdd,editComponent,compModeFields,saveComponent,delComponent,editAssessment,saveAssessment,exportData,importData,resetData,closeModal,setMode,setPartner,openWeekForm,saveWeek,deleteWeek,verifyWeek,setModule,setBenchmarkBasis,shellGoPortfolio,shellGoModule,shellGoPartner,toggleShellPartnershipMenu,selectShellPartnership});

(async function boot(){
  if(SB){
    try{
      SB.auth.onAuthStateChange((event,sess)=>{
        if(event==='PASSWORD_RECOVERY'){ renderSetNewPassword(); return; }
        if(sess && document.getElementById('loginEmail')){ location.reload(); }
      });
      const {data:{session}}=await SB.auth.getSession();
      if(!session){ renderLogin(); return; }
      view.email=session.user.email;
      // owner?
      const {data:owner}=await SB.from('pr_owner').select('email').eq('email',view.email).maybeSingle();
      if(owner){ view.role='owner'; view.mode='internal'; STATE=await db.load(); if(!STATE||!STATE.partnerships){STATE=seed();await db.save(STATE);} else if(ensureCorePartnerships(STATE)){await db.save(STATE);} await ownerRefreshWeeks(); render(); return; }
      // partner?
      view.role='partner'; view.mode='partner'; await loadPartnerData();
      if(STATE.partnerships.length){ render(); return; }
      renderNoAccess(); return;
    }catch(e){ console.error(e); renderLogin('Something went wrong connecting. Check the console.'); return; }
  }
  // local mode (no anon key yet) — works exactly as before
  try{ STATE=await db.load(); }catch(e){ console.error('local load failed',e); STATE=null; }
  if(!STATE||!Array.isArray(STATE.partnerships)||STATE.partnerships.length===0){ STATE=seed(); try{await persist();}catch(e){/* toast already shown; still render so the app is usable */} }
  else if(ensureCorePartnerships(STATE)){ try{await persist();}catch(e){/* toast already shown */} }
  render();
})();
</script>
